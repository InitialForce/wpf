# .github/workflows/pr-ingestion.yml
name: PR Ingestion (Cherry-Pick)

on:
  repository_dispatch:
    types: [pr-ingestion-requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Upstream PR number to cherry-pick"
        required: true
        type: string
      head_sha:
        description: "Expected upstream HEAD SHA (pinned at review time)"
        required: true
        type: string

concurrency:
  group: ingestion-${{ inputs.pr_number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
  PINNED_HEAD_SHA: ${{ inputs.head_sha || github.event.client_payload.head_sha }}

# ---------------------------------------------------------------------------
# Job 1: gate — autonomy-check (reusable workflow)
# ---------------------------------------------------------------------------
jobs:
  gate:
    name: Autonomy gate
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: cherry-pick

  # -------------------------------------------------------------------------
  # Job 2: pre-flight — graduation check before we apply anything
  # -------------------------------------------------------------------------
  pre-flight:
    name: Pre-flight graduation check
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      action: ${{ steps.check.outputs.action }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/dotnet/wpf.git || true

      - name: Fetch upstream
        run: git fetch upstream release/10.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cherry-pick-pre-flight.sh
        id: check
        run: |
          RESULT=$(bash tools/cherry-pick-pre-flight.sh \
            --pr-number "${{ env.PR_NUMBER }}" \
            --head-sha "${{ env.PINNED_HEAD_SHA }}" \
            --upstream-ref upstream \
            --ledger-path .if-fork/patch-ledger.jsonl)
          ACTION=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Pre-flight result: $ACTION"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"

      - name: Handle graduated — end workflow (no work needed)
        if: steps.check.outputs.action == 'skip'
        run: |
          echo "::notice::PR #${{ env.PR_NUMBER }} is already graduated — nothing to do."

      - name: Handle partial graduation — open issue and fail
        if: steps.check.outputs.action == 'escalate'
        run: |
          python tools/ledger-event.py \
            --event pre_flight_failed \
            --pr-number "${{ env.PR_NUMBER }}" \
            --head-sha "${{ env.PINNED_HEAD_SHA }}" \
            --actor "${{ github.actor }}" \
            --details-json '{"reason": "partial_graduation_detected", "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            --push
          gh issue create \
            --title "Partial graduation detected: upstream PR #${{ env.PR_NUMBER }}" \
            --body "Pre-flight detected partial graduation for upstream PR #${{ env.PR_NUMBER }} (pinned SHA: ${{ env.PINNED_HEAD_SHA }}). Manual review required.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "escalation,cherry-pick"
          echo "::error::Partial graduation detected — workflow stopped. Issue opened."
          exit 1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"

  # -------------------------------------------------------------------------
  # Job 3: sha-smuggling-check — verify HEAD SHA matches ledger
  # -------------------------------------------------------------------------
  sha-smuggling-check:
    name: SHA-smuggling check
    needs: [gate, pre-flight]
    if: needs.gate.outputs.proceed == 'true' && needs.pre-flight.outputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/dotnet/wpf.git || true
          git fetch upstream release/10.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify upstream HEAD SHA matches ledger
        id: verify-sha
        run: |
          # Read the most recent review_1 or review_2 entry for this PR from the ledger.
          # The ledger is a JSONL file at .if-fork/patch-ledger.jsonl.
          # If there is no review entry, we FAIL — we must not proceed without one.
          LEDGER_SHA=$(python3 - <<'PYEOF'
          import json, sys

          pr = int("${{ env.PR_NUMBER }}")
          ledger_path = ".if-fork/patch-ledger.jsonl"

          review_sha = None
          try:
              with open(ledger_path) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      entry = json.loads(line)
                      if entry.get("pr_number") == pr and entry.get("event") in ("review_1", "review_2"):
                          review_sha = entry.get("head_sha")
          except FileNotFoundError:
              print("ERROR: ledger file not found", file=sys.stderr)
              sys.exit(1)

          if review_sha is None:
              print("ERROR: no review_1/review_2 entry found in ledger for PR", pr, file=sys.stderr)
              sys.exit(2)

          print(review_sha)
          PYEOF
          )

          PYEXIT=$?
          if [ $PYEXIT -ne 0 ]; then
            echo "::error::Ledger lookup failed (exit $PYEXIT) — no review entry found for PR #${{ env.PR_NUMBER }}. Refusing to proceed."
            python tools/ledger-event.py \
              --event escalated \
              --pr-number "${{ env.PR_NUMBER }}" \
              --head-sha "${{ env.PINNED_HEAD_SHA }}" \
              --actor "${{ github.actor }}" \
              --details-json '{"reason": "sha_smuggling_detected", "cause": "no_review_entry_in_ledger"}' \
              --push
            exit 1
          fi

          echo "Ledger SHA: $LEDGER_SHA"
          echo "Pinned SHA (input): ${{ env.PINNED_HEAD_SHA }}"

          if [ "${{ env.PINNED_HEAD_SHA }}" != "$LEDGER_SHA" ]; then
            echo "::error::SHA mismatch — SHA-smuggling attack detected!"
            echo "  Ledger:  $LEDGER_SHA"
            echo "  Pinned:  ${{ env.PINNED_HEAD_SHA }}"
            python tools/ledger-event.py \
              --event escalated \
              --pr-number "${{ env.PR_NUMBER }}" \
              --head-sha "${{ env.PINNED_HEAD_SHA }}" \
              --actor "${{ github.actor }}" \
              --details-json "{\"reason\": \"sha_smuggling_detected\", \"ledger_sha\": \"$LEDGER_SHA\", \"pinned_sha\": \"${{ env.PINNED_HEAD_SHA }}\"}" \
              --push
            exit 1
          fi

          echo "::notice::SHA verification passed — pinned SHA matches ledger."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"

  # -------------------------------------------------------------------------
  # Job 4: cherry-pick — Claude Sonnet applies the patch
  # -------------------------------------------------------------------------
  cherry-pick:
    name: Cherry-pick PR #${{ github.event.client_payload.pr_number || inputs.pr_number }}
    needs: [gate, sha-smuggling-check]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      branch: ${{ steps.set-branch.outputs.branch }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/dotnet/wpf.git || true
          git fetch upstream release/10.0

      - name: Set cherry-pick branch name
        id: set-branch
        run: |
          BRANCH="claude/cherry-pick-pr-${{ env.PR_NUMBER }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "CHERRY_PICK_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Create cherry-pick branch
        run: |
          git checkout -b "${{ steps.set-branch.outputs.branch }}" if/staging || \
            git checkout "${{ steps.set-branch.outputs.branch }}"

      - name: Run cherry-pick (Claude Sonnet)
        id: pick
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --prompt-file .if-fork/prompts/cherry-pick.md
            --max-turns 15
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,Edit,Grep,mcp__github__pull_request_read,mcp__github__get_file_contents,mcp__github__issue_write
            --disallowedTools mcp__github__push_files
          github_token: ${{ steps.app-token.outputs.token }}
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          PINNED_HEAD_SHA: ${{ env.PINNED_HEAD_SHA }}
          CHERRY_PICK_BRANCH: ${{ steps.set-branch.outputs.branch }}

      - name: Run conflict-resolution if cherry-pick failed
        if: steps.pick.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --prompt-file .if-fork/prompts/cherry-pick-conflict-resolution.md
            --max-turns 10
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,Edit,Grep,mcp__github__issue_write
            --disallowedTools mcp__github__push_files
          github_token: ${{ steps.app-token.outputs.token }}
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          CHERRY_PICK_BRANCH: ${{ steps.set-branch.outputs.branch }}

      - name: Push cherry-pick branch
        run: |
          git push origin "${{ steps.set-branch.outputs.branch }}" --force-with-lease
        env:
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"

  # -------------------------------------------------------------------------
  # Job 5: denylist-check — check changed files against file_denylist
  # -------------------------------------------------------------------------
  denylist-check:
    name: Denylist check
    needs: [gate, cherry-pick]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cherry-pick.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch staging base
        run: git fetch origin if/staging

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run denylist check
        id: denylist
        run: |
          CHANGED_FILES=$(git diff --name-only origin/if/staging...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          python3 tools/check-denylist.py \
            --config .if-fork/config.yaml \
            --files <(echo "$CHANGED_FILES")
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # -------------------------------------------------------------------------
  # Job 6: build-and-test — trigger build.yml on cherry-pick branch
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    needs: [gate, denylist-check]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Trigger build.yml and capture run ID
        run: |
          BRANCH="${{ needs.cherry-pick.outputs.branch }}"
          DISPATCH_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build.yml \
            --ref "$BRANCH" \
            --repo "${{ github.repository }}"
          # Wait briefly for run to appear (gh workflow run is async HTTP 204)
          RUN_ID=""
          for i in {1..10}; do
            RUN_ID=$(gh run list \
              --workflow=build.yml \
              --branch="$BRANCH" \
              --event=workflow_dispatch \
              --limit=5 \
              --created=">=$DISPATCH_TS" \
              --json databaseId,createdAt \
              --jq '.[0].databaseId // empty' \
              --repo "${{ github.repository }}" 2>/dev/null || true)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not capture build run ID after 10 attempts — cannot track build."
            exit 1
          fi
          echo "::notice::Build workflow triggered (run ID: $RUN_ID) for branch $BRANCH"
          gh run watch "$RUN_ID" --exit-status --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # -------------------------------------------------------------------------
  # Job 7: perf-gate — check for performance regressions
  # -------------------------------------------------------------------------
  perf-gate:
    name: Performance regression gate
    needs: [gate, build-and-test, cherry-pick]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cherry-pick.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download perf artifacts from build run
        run: |
          gh run download \
            --repo "${{ github.repository }}" \
            --pattern "perf-results-*" \
            --dir /tmp/perf-results/ || echo "No perf artifacts found."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run perf regression check
        id: perf
        run: |
          python3 tools/check-regression.py \
            --current /tmp/perf-results/current.json \
            --baseline perf/baseline.json \
            --current-sha ${{ github.sha }} \
            --output /tmp/perf-gate-result.json \
            --threshold-warn 5 \
            --threshold-fail 15
        continue-on-error: true

      - name: Open perf-regression issue if gate failed
        if: steps.perf.outcome == 'failure'
        run: |
          gh issue create \
            --title "Perf regression detected: upstream PR #${{ env.PR_NUMBER }}" \
            --body "Performance regression gate failed for upstream PR #${{ env.PR_NUMBER }} on branch \`${{ needs.cherry-pick.outputs.branch }}\`.\n\nSee run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "perf-regression,cherry-pick"
          exit 1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # -------------------------------------------------------------------------
  # Job 8: open-pr — open internal PR, emit ledger event, set auto-merge timer
  # -------------------------------------------------------------------------
  open-pr:
    name: Open internal PR and set auto-merge timer
    needs: [gate, perf-gate, cherry-pick]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      internal_pr_number: ${{ steps.open-pr.outputs.pr_number }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Open internal PR
        id: open-pr
        run: |
          BRANCH="claude/cherry-pick-pr-${{ env.PR_NUMBER }}"
          PR_URL=$(gh pr create \
            --title "cherry-pick: upstream #${{ env.PR_NUMBER }}" \
            --body "Automated cherry-pick of upstream dotnet/wpf#${{ env.PR_NUMBER }}.\n\nPinned SHA: \`${{ env.PINNED_HEAD_SHA }}\`\n\nAll gates passed (denylist, build, smoke, perf). Awaiting merge.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base if/staging \
            --head "$BRANCH" \
            --label "automated,cherry-pick" \
            --repo "${{ github.repository }}")
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Opened internal PR #$PR_NUM: $PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Emit cherry_picked ledger event
        run: |
          python tools/ledger-event.py \
            --event cherry_picked \
            --pr-number "${{ env.PR_NUMBER }}" \
            --head-sha "${{ env.PINNED_HEAD_SHA }}" \
            --actor "${{ github.actor }}" \
            --details-json "{\"internal_pr\": \"${{ steps.open-pr.outputs.pr_number }}\", \"branch\": \"claude/cherry-pick-pr-${{ env.PR_NUMBER }}\"}" \
            --push
        env:
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge (24h timer) if not frozen
        if: vars.IF_AUTOMERGE_FROZEN != 'true'
        run: |
          gh pr merge "${{ steps.open-pr.outputs.pr_number }}" \
            --auto --squash \
            --repo "${{ github.repository }}"
          echo "::notice::Auto-merge enabled for PR #${{ steps.open-pr.outputs.pr_number }} (24h timer)"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
