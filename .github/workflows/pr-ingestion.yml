# .github/workflows/pr-ingestion.yml
#
# Applies one approved upstream dotnet/wpf PR to the fork and opens a PR to
# if/main. Triggered by pr-review.yml (tools/dispatch-approved.py sends
# repository_dispatch "pr-ingestion-requested" with pr_number and head_sha) or
# by hand.
#
# Trust model:
#   - Every job validates pr_number (^[0-9]+$) and head_sha (^[0-9a-f]{40}$)
#     first, and payload values reach shell only through env.
#   - Checker code and policy (check-denylist.py, check-commit-denylist.py,
#     config.yaml) always come from a separate checkout of if/main
#     ("trusted/"), never from the candidate tree.
#   - Claude runs only in resolve-conflicts and review-resolution, jobs with
#     contents:read, no App token, no GPG key and no persisted credentials.
#     Both load only the action's own user settings (no project settings,
#     hooks or MCP servers from the candidate tree) and have no shell. In
#     resolve-conflicts Claude reads the work tree and edits only the
#     conflicted files. tools/prepare-resolver.sh refuses to start
#     it when the tree holds agent configuration. It hands back only the
#     conflicted files, as an artifact. The finalize job recreates the
#     conflict itself, takes only those paths from the artifact, checks them,
#     and only then signs and pushes.
#   - Nothing is pushed before the whole branch diff passes file_denylist.
#   - A resolution Claude wrote is reviewed before it can merge by itself.
#     prepare-resolution-review (no secrets) pins the approved upstream diff,
#     the pushed branch diff and a novel-lines report (tools/novel-lines.py).
#     review-resolution (Fable, the pr-review.yml reviewer limits) writes a
#     verdict. record-resolution-verdict (trusted) checks the verdict's
#     origin, applies code rules (tools/record-resolution-verdict.py) and
#     records resolution_approved or resolution_rejected for the exact branch
#     commit. automerge-verify.sh merges a Conflict-Resolved-By cherry-pick
#     only with resolution_approved for its head SHA; open-pr leaves
#     needs-human-merge on everything else.
#   - cherry-pick records the if/main commit it starts from (main_sha).
#     resolve-conflicts and finalize branch from exactly that commit, so a
#     change that lands on if/main meanwhile cannot be overwritten by a
#     resolution made on an older tree. automerge.yml rebuilds the PR when
#     if/main has moved.
#
# Flow: gate -> pre-flight (already in the fork?) -> approval check (the
# exact pair must be approved in the ledger) -> cherry-pick (deterministic) ->
# [resolve-conflicts -> finalize -> prepare-resolution-review ->
# review-resolution -> record-resolution-verdict] -> open or reuse the PR to
# if/main.
# build.yml runs on that PR; automerge.yml merges it when it passes.
name: PR Ingestion (Cherry-Pick)

on:
  repository_dispatch:
    types: [pr-ingestion-requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Upstream PR number to cherry-pick"
        required: true
        type: string
      head_sha:
        description: "Expected upstream HEAD SHA (pinned at review time)"
        required: true
        type: string

concurrency:
  group: ingestion-${{ inputs.pr_number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
  PINNED_HEAD_SHA: ${{ inputs.head_sha || github.event.client_payload.head_sha }}

jobs:
  # -------------------------------------------------------------------------
  # Job 1: gate — autonomy-check (reusable workflow)
  # -------------------------------------------------------------------------
  gate:
    name: Autonomy gate
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: cherry-pick

  # -------------------------------------------------------------------------
  # Job 2: pre-flight — is the change already in the fork?
  # -------------------------------------------------------------------------
  pre-flight:
    name: Pre-flight graduation check
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      action: ${{ steps.check.outputs.action }}

    steps:
      - name: Validate payload
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number or head_sha"; exit 1; }

      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: if/main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/dotnet/wpf.git || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Run cherry-pick-pre-flight.sh
        id: check
        run: |
          # The script exits 2 on partial graduation; capture it instead of
          # letting bash -e end the step before the action is recorded.
          set +e
          RESULT=$(bash tools/cherry-pick-pre-flight.sh \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PINNED_HEAD_SHA" \
            --upstream-ref upstream \
            --ledger-path .if-fork/patch-ledger.jsonl)
          RC=$?
          set -e
          echo "$RESULT"
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "::error::Pre-flight failed (exit $RC)."
            exit 1
          fi
          ACTION=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Pre-flight result: $ACTION"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Handle graduated (nothing to do)
        if: steps.check.outputs.action == 'skip'
        run: |
          echo "::notice::Upstream PR #$PR_NUMBER is already in the fork. Nothing to do."

      - name: Handle partial graduation — stop for a human
        if: steps.check.outputs.action == 'escalate'
        run: |
          # The pre-flight script already recorded an 'escalated' ledger event.
          echo "::error::Upstream PR #$PR_NUMBER is partly in the fork already. A human must decide what to apply."
          exit 1

  # -------------------------------------------------------------------------
  # Job 3: approval check — the exact (pr_number, head_sha) must be approved
  # (also the SHA-smuggling check: a dispatched head that was not the
  # reviewed and approved head is refused)
  # -------------------------------------------------------------------------
  sha-smuggling-check:
    name: Approval and SHA check
    needs: [gate, pre-flight]
    if: needs.gate.outputs.proceed == 'true' && needs.pre-flight.outputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Validate payload
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number or head_sha"; exit 1; }

      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: if/main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Require an approved verdict for this exact head in the ledger
        run: |
          set +e
          RESULT=$(python3 tools/check-approval.py --ledger .if-fork/patch-ledger.jsonl \
            --pr-number "$PR_NUMBER" --head-sha "$PINNED_HEAD_SHA")
          RC=$?
          set -e
          echo "$RESULT"
          if [ "$RC" -ne 0 ]; then
            echo "::error::Upstream PR #$PR_NUMBER at $PINNED_HEAD_SHA is not approved in the ledger. Refusing to apply."
            python tools/ledger-event.py \
              --event escalated \
              --pr-number "$PR_NUMBER" \
              --head-sha "$PINNED_HEAD_SHA" \
              --actor pr-ingestion \
              --details-json '{"reason": "sha_smuggling_detected", "cause": "no_approved_verdict_for_head"}' \
              --push
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Job 4: cherry-pick — deterministic apply on a branch from if/main.
  # No model runs here. A clean result is checked and pushed here.
  # -------------------------------------------------------------------------
  cherry-pick:
    name: Cherry-pick PR #${{ github.event.client_payload.pr_number || inputs.pr_number }}
    needs: [gate, sha-smuggling-check]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    defaults:
      run:
        working-directory: work
    outputs:
      branch: ${{ steps.set-branch.outputs.branch }}
      main_sha: ${{ steps.base.outputs.sha }}
      title: ${{ steps.apply.outputs.title }}
      result: ${{ steps.apply.outputs.result }}
      conflicts_allowed: ${{ steps.conflict-denylist.outputs.allowed }}
      pushed: ${{ steps.finish.outputs.pushed }}

    steps:
      - name: Validate payload
        working-directory: .
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number or head_sha"; exit 1; }

      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Check out if/main (trusted tools and policy)
        uses: actions/checkout@v4
        with:
          ref: if/main
          path: trusted
          persist-credentials: false

      - name: Check out if/main (work tree)
        uses: actions/checkout@v4
        with:
          ref: if/main
          path: work
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/dotnet/wpf.git || true

      - name: Pin the if/main commit for this run
        id: base
        run: echo "sha=$(git rev-parse origin/if/main)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set cherry-pick branch name
        id: set-branch
        run: echo "branch=claude/cherry-pick-pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Import bot GPG key
        uses: ./trusted/.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Apply upstream change
        id: apply
        run: |
          bash "$TRUSTED/tools/apply-upstream-pr.sh"
          {
            echo "result=$(cat "$OUT/result")"
            echo "title=$(cat "$OUT/title" 2>/dev/null)"
            echo "reason=$(cat "$OUT/reason" 2>/dev/null)"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.set-branch.outputs.branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          OUT: ${{ runner.temp }}/apply
          TRUSTED: ${{ github.workspace }}/trusted

      - name: Refuse conflicts on denylisted files
        id: conflict-denylist
        if: steps.apply.outputs.result == 'conflict'
        run: |
          if python3 "$TRUSTED/tools/check-denylist.py" --config "$TRUSTED/.if-fork/config.yaml" \
               --changed-files "$RUNNER_TEMP/apply/conflicts.txt"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
          git cherry-pick --abort
        env:
          TRUSTED: ${{ github.workspace }}/trusted

      - name: Check the whole diff, add trailers and push
        id: finish
        if: steps.apply.outputs.result == 'applied'
        run: |
          bash "$TRUSTED/tools/finish-ingestion-branch.sh"
          echo "pushed=$(cat "$OUT/pushed" 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"
          if [ -f "$OUT/reason" ]; then echo "reason=$(cat "$OUT/reason")" >> "$GITHUB_OUTPUT"; fi
        env:
          BRANCH: ${{ steps.set-branch.outputs.branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          OUT: ${{ runner.temp }}/finish
          TRUSTED: ${{ github.workspace }}/trusted

      - name: Record already-applied change
        if: steps.apply.outputs.result == 'empty'
        run: |
          git checkout -q -B if/main origin/if/main
          python "$TRUSTED/tools/ledger-event.py" \
            --event graduated_upstream \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PINNED_HEAD_SHA" \
            --actor pr-ingestion \
            --details-json '{"detection_method":"empty_cherry_pick"}' \
            --push
        env:
          TRUSTED: ${{ github.workspace }}/trusted

      - name: Escalate when the change could not be applied
        if: >-
          steps.apply.outputs.result == 'refused' ||
          steps.conflict-denylist.outputs.allowed == 'false' ||
          steps.finish.outputs.reason != ''
        run: |
          REASON="${APPLY_REASON:-$FINISH_REASON}"
          [ -z "$REASON" ] && REASON=conflict_in_denylist
          bash "$TRUSTED/tools/ingestion-escalate.sh" "$REASON"
        env:
          APPLY_REASON: ${{ steps.apply.outputs.reason }}
          FINISH_REASON: ${{ steps.finish.outputs.reason }}
          TRUSTED: ${{ github.workspace }}/trusted

  # -------------------------------------------------------------------------
  # Job 5: resolve-conflicts — Claude, with no credentials beyond a
  # read-only token. Returns only the conflicted files as an artifact.
  # -------------------------------------------------------------------------
  resolve-conflicts:
    name: Resolve conflicts (no credentials)
    environment: claude
    needs: [gate, cherry-pick]
    if: >-
      needs.gate.outputs.proceed == 'true' &&
      needs.cherry-pick.outputs.result == 'conflict' &&
      needs.cherry-pick.outputs.conflicts_allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ needs.cherry-pick.outputs.main_sha }}

    steps:
      - name: Validate payload
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number, head_sha or if/main SHA"; exit 1; }

      - name: Check out the pinned if/main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Recreate the conflicted cherry-pick
        run: |
          # Copy the scripts out first: the cherry-pick and the agent change the tree.
          cp tools/apply-upstream-pr.sh tools/conflict-handoff.sh tools/prepare-resolver.sh "$RUNNER_TEMP/"
          git config user.name "Claude (Initial Force WPF Bot)"
          git config user.email "wpf-bot@initialforce.com"
          git remote add upstream https://github.com/dotnet/wpf.git
          bash "$RUNNER_TEMP/apply-upstream-pr.sh"
          test "$(cat "$OUT/result")" = conflict
          echo "SOURCE_SHA=$(cat "$OUT/source")" >> "$GITHUB_ENV"
          {
            echo 'CONFLICT_FILES<<__EOF_FILES__'
            cat "$OUT/conflicts.txt"
            echo '__EOF_FILES__'
          } >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: claude/cherry-pick-pr-${{ env.PR_NUMBER }}
          OUT: ${{ runner.temp }}/apply
          TRUSTED: ${{ github.workspace }}

      - name: Prepare the agent's input and tool rules
        id: prepare
        run: |
          set +e
          ALLOWED=$(bash "$RUNNER_TEMP/prepare-resolver.sh" "$RUNNER_TEMP/apply/conflicts.txt" .resolver-input)
          RC=$?
          set -e
          case "$RC" in
            0) { echo "run=true"; echo "allowed=$ALLOWED"; } >> "$GITHUB_OUTPUT" ;;
            3) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$RC" ;;
          esac

      - name: Load cherry-pick conflict prompt
        id: load-prompt-pick
        run: |
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/cherry-pick.md
            echo
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      # Trusted settings only: --setting-sources user skips the tree's
      # .claude/ and CLAUDE.md, --strict-mcp-config skips its .mcp.json, and
      # disableAllHooks turns hooks off. The deny rules keep the process
      # environment (/proc) and the runner's command files (_temp) out of
      # reach; a double slash is an absolute path in a permission rule.
      - name: Resolve conflicts (Claude Sonnet)
        id: pick
        if: steps.prepare.outputs.run == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: initial-force-wpf-bot
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt-pick.outputs.prompt }}
          settings: '{"disableAllHooks": true}'
          claude_args: >-
            --max-turns 30
            --model claude-sonnet-4-6
            --setting-sources user
            --strict-mcp-config
            --allowedTools "${{ steps.prepare.outputs.allowed }}"
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,Task,Read(//proc/**),Read(/proc/**),Read(//home/runner/work/_temp/**),Read(/home/runner/work/_temp/**),Edit(//home/runner/work/_temp/**),mcp__github__push_files,mcp__github__create_pull_request"
          github_token: ${{ github.token }}
        env:
          CONFIG_PATH: .if-fork/config.yaml
          RESOLVER_INPUT: .resolver-input
          ESCALATION_ISSUE_PATH: ${{ github.workspace }}/.escalation.md

      - name: Collect the resolved conflict files
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/resolution"
          bash "$RUNNER_TEMP/conflict-handoff.sh" collect "$RUNNER_TEMP/apply/conflicts.txt" "$RUNNER_TEMP/resolution" .resolver-delete.txt
          if [ -f .escalation.md ]; then cp .escalation.md "$RUNNER_TEMP/resolution/escalation.md"; fi

      - name: Upload resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cherry-pick-resolution
          path: ${{ runner.temp }}/resolution/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 6: finalize — trusted. Recreate the conflict, take only the
  # conflicted paths from the artifact, check, sign and push.
  # -------------------------------------------------------------------------
  finalize:
    name: Check resolution and push
    needs: [gate, cherry-pick, resolve-conflicts]
    if: needs.gate.outputs.proceed == 'true' && needs.resolve-conflicts.result == 'success'
    runs-on: ubuntu-latest
    environment: bot-credentials
    defaults:
      run:
        working-directory: work
    env:
      BASE_SHA: ${{ needs.cherry-pick.outputs.main_sha }}
    outputs:
      pushed: ${{ steps.finish.outputs.pushed }}
      # The exact commit pushed, which the resolution review checks and the
      # ledger approval names.
      branch_sha: ${{ steps.finish.outputs.sha }}
      # Conflicted paths, space-separated. prepare-resolver.sh already refused
      # any path with characters outside A-Z a-z 0-9 . _ / + -.
      conflict_files: ${{ steps.overlay.outputs.conflicts }}

    steps:
      - name: Validate payload
        working-directory: .
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number, head_sha or if/main SHA"; exit 1; }

      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Check out if/main (trusted tools and policy)
        uses: actions/checkout@v4
        with:
          ref: if/main
          path: trusted
          persist-credentials: false

      - name: Check out the pinned if/main commit (work tree)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: work
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/dotnet/wpf.git || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Import bot GPG key
        uses: ./trusted/.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Download resolution
        uses: actions/download-artifact@v4
        with:
          name: cherry-pick-resolution
          path: ${{ runner.temp }}/resolution

      - name: Recreate the conflict and apply the resolution
        id: overlay
        run: |
          bash "$TRUSTED/tools/apply-upstream-pr.sh"
          if [ "$(cat "$OUT/result")" != conflict ]; then
            echo "reason=reapply_mismatch" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -s "$RUNNER_TEMP/resolution/escalation.md" ]; then
            cat "$RUNNER_TEMP/resolution/escalation.md"
            echo "reason=cherry_pick_conflict" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! bash "$TRUSTED/tools/conflict-handoff.sh" apply "$OUT/conflicts.txt" "$RUNNER_TEMP/resolution"; then
            echo "reason=cherry_pick_conflict" >> "$GITHUB_OUTPUT"; exit 0
          fi
          GIT_EDITOR=true git cherry-pick --continue
          {
            echo "ok=true"
            echo "conflicts=$(tr '\n' ' ' < "$OUT/conflicts.txt")"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.cherry-pick.outputs.branch }}
          OUT: ${{ runner.temp }}/apply
          TRUSTED: ${{ github.workspace }}/trusted

      - name: Check the whole diff, add trailers and push
        id: finish
        if: steps.overlay.outputs.ok == 'true'
        run: |
          bash "$TRUSTED/tools/finish-ingestion-branch.sh"
          echo "pushed=$(cat "$OUT/pushed" 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"
          if [ -f "$OUT/sha" ]; then echo "sha=$(cat "$OUT/sha")" >> "$GITHUB_OUTPUT"; fi
          if [ -f "$OUT/reason" ]; then echo "reason=$(cat "$OUT/reason")" >> "$GITHUB_OUTPUT"; fi
        env:
          BRANCH: ${{ needs.cherry-pick.outputs.branch }}
          OUT: ${{ runner.temp }}/finish
          TRUSTED: ${{ github.workspace }}/trusted
          # Adds the Conflict-Resolved-By trailer. automerge merges such a
          # commit only with a resolution_approved ledger event for it.
          CONFLICT_RESOLVED: "true"

      - name: Escalate when the resolution was not accepted
        if: steps.overlay.outputs.reason != '' || steps.finish.outputs.reason != ''
        run: bash "$TRUSTED/tools/ingestion-escalate.sh" "${OVERLAY_REASON:-$FINISH_REASON}"
        env:
          OVERLAY_REASON: ${{ steps.overlay.outputs.reason }}
          FINISH_REASON: ${{ steps.finish.outputs.reason }}
          TRUSTED: ${{ github.workspace }}/trusted

  # -------------------------------------------------------------------------
  # Job 7: prepare-resolution-review. No secrets. Pin what the resolution
  # reviewer sees: the approved upstream diff, the pushed branch diff, the
  # three versions of each changed file and the novel-lines report.
  # -------------------------------------------------------------------------
  prepare-resolution-review:
    name: Write the resolution review input
    needs: [gate, cherry-pick, finalize]
    if: needs.gate.outputs.proceed == 'true' && needs.finalize.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ needs.cherry-pick.outputs.main_sha }}
      BRANCH_SHA: ${{ needs.finalize.outputs.branch_sha }}
      CONFLICT_FILES: ${{ needs.finalize.outputs.conflict_files }}

    steps:
      - name: Validate payload
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BRANCH_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number, head_sha, if/main SHA or branch SHA"; exit 1; }

      - name: Check out if/main (trusted tools)
        uses: actions/checkout@v4
        with:
          ref: if/main
          path: trusted
          persist-credentials: false

      - name: Check out the pushed branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_SHA }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the review input
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/resolution-review-input
          UP: ${{ runner.temp }}/upstream.git
          TRUSTED: ${{ github.workspace }}/trusted
        run: |
          set -euo pipefail
          mkdir -p "$OUT/base" "$OUT/upstream-head" "$OUT/final"

          # The reviewed commit must be the pushed one, exactly one commit on
          # the pinned if/main commit.
          [ "$(git rev-parse HEAD)" = "$BRANCH_SHA" ] \
            || { echo "::error::Checked-out commit is not $BRANCH_SHA"; exit 1; }
          [ "$(git rev-list --parents -n 1 "$BRANCH_SHA")" = "$BRANCH_SHA $BASE_SHA" ] \
            || { echo "::error::$BRANCH_SHA is not one commit on $BASE_SHA"; exit 1; }

          set -f
          for f in $CONFLICT_FILES; do
            [[ "$f" =~ ^[A-Za-z0-9._+-][A-Za-z0-9._/+-]*$ ]] && [[ "/$f/" != */../* ]] \
              || { echo "::error::Unexpected conflicted path"; exit 1; }
            echo "$f" >> "$OUT/conflicts.txt"
          done
          set +f
          [ -s "$OUT/conflicts.txt" ] || { echo "::error::No conflicted paths recorded"; exit 1; }

          # The upstream diff the reviewers approved, pinned as pr-review.yml
          # pins it: refs/pull/N/head must still be the approved head.
          gh api "repos/dotnet/wpf/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          UP_BASE=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")
          [[ "$UP_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Upstream PR has no usable base SHA"; exit 1; }
          git clone --quiet --bare --filter=blob:none --no-tags --single-branch \
            --branch main https://github.com/dotnet/wpf.git "$UP"
          git --git-dir="$UP" fetch --quiet --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/pr/head"
          git --git-dir="$UP" cat-file -e "$UP_BASE^{commit}" 2>/dev/null \
            || git --git-dir="$UP" fetch --quiet --no-tags origin "$UP_BASE"
          FETCHED=$(git --git-dir="$UP" rev-parse refs/pr/head)
          [ "$FETCHED" = "$PINNED_HEAD_SHA" ] \
            || { echo "::error::Upstream PR head is $FETCHED, not the approved $PINNED_HEAD_SHA"; exit 1; }
          MERGE_BASE=$(git --git-dir="$UP" merge-base "$UP_BASE" "$PINNED_HEAD_SHA")
          git --git-dir="$UP" diff --no-color --no-ext-diff --no-renames \
            "$MERGE_BASE" "$PINNED_HEAD_SHA" > "$OUT/upstream.diff"

          git diff --no-color --no-ext-diff --no-renames "$BASE_SHA" "$BRANCH_SHA" > "$OUT/final.diff"
          git diff --name-only --no-renames -z "$BASE_SHA" "$BRANCH_SHA" > "$RUNNER_TEMP/files.z"
          if [ "$(tr -dc '\n' < "$RUNNER_TEMP/files.z" | wc -c)" -gt 0 ]; then
            echo "::error::A changed file name contains a newline."
            exit 1
          fi
          tr '\0' '\n' < "$RUNNER_TEMP/files.z" > "$OUT/files.txt"
          [ -s "$OUT/final.diff" ] || { echo "::error::Empty branch diff"; exit 1; }

          # Three versions of each changed file, 1 MB max each. A file that is
          # not copied cannot excuse a novel line.
          copy() { # <git dir> <commit> <path> <dest root>
            git --git-dir="$1" cat-file -e "$2:$3" 2>/dev/null || return 0
            [ "$(git --git-dir="$1" cat-file -s "$2:$3")" -le 1048576 ] || return 0
            mkdir -p "$4/$(dirname -- "$3")"
            git --git-dir="$1" show "$2:$3" > "$4/$3"
          }
          while IFS= read -r -d '' path; do
            copy .git "$BASE_SHA" "$path" "$OUT/base"
            copy .git "$BRANCH_SHA" "$path" "$OUT/final"
            copy "$UP" "$PINNED_HEAD_SHA" "$path" "$OUT/upstream-head"
          done < "$RUNNER_TEMP/files.z"

          python3 "$TRUSTED/tools/novel-lines.py" \
            --final-diff "$OUT/final.diff" --upstream-diff "$OUT/upstream.diff" \
            --base-dir "$OUT/base" --upstream-head-dir "$OUT/upstream-head" \
            --output "$OUT/novel-lines.json"

          jq -n --slurpfile pr "$RUNNER_TEMP/pr.json" --slurpfile novel "$OUT/novel-lines.json" \
            --arg head "$PINNED_HEAD_SHA" --arg base "$BASE_SHA" --arg branch "$BRANCH_SHA" \
            --arg mb "$MERGE_BASE" --argjson files "$(grep -c . "$OUT/files.txt")" \
            --argjson conflicts "$(grep -c . "$OUT/conflicts.txt")" \
            '{pr_number: $pr[0].number, title: $pr[0].title, upstream_head_sha: $head,
              upstream_merge_base: $mb, base_sha: $base, branch_sha: $branch,
              files_changed: $files, conflicted_files: $conflicts,
              novel_count: $novel[0].novel_count, dropped_count: $novel[0].dropped_count}' \
            > "$OUT/meta.json"
          cat "$OUT/meta.json"

      - name: Upload review input
        uses: actions/upload-artifact@v4
        with:
          name: resolution-review-input
          path: ${{ runner.temp }}/resolution-review-input
          retention-days: 30
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Job 8: review-resolution. Fable reviews the resolution. Same limits as
  # the pr-review.yml reviewers: read-only token, sparse checkout of the
  # config and prompts only, trusted settings only, Read limited to the
  # input and the config, Write limited to its verdict file, no shell.
  # -------------------------------------------------------------------------
  review-resolution:
    name: Review the conflict resolution (Fable)
    needs: [gate, cherry-pick, finalize, prepare-resolution-review]
    if: needs.gate.outputs.proceed == 'true' && needs.finalize.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    environment: claude
    permissions:
      contents: read
    # record-resolution-verdict checks the verdict against these.
    outputs:
      reviewer_id: ${{ steps.settings.outputs.reviewer_id }}
      verdict_sha256: ${{ steps.verdict.outputs.sha256 }}
      upload: ${{ steps.upload.outcome }}
    env:
      BASE_SHA: ${{ needs.cherry-pick.outputs.main_sha }}
      BRANCH_SHA: ${{ needs.finalize.outputs.branch_sha }}

    steps:
      - name: Validate payload
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BRANCH_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number, head_sha, if/main SHA or branch SHA"; exit 1; }

      # Only the policy file and the prompts. The working directory holds
      # nothing else from the repository: no .claude/, .mcp.json or CLAUDE.md.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.if-fork/config.yaml
            /.if-fork/prompts/

      - name: Download pinned review input
        uses: actions/download-artifact@v4
        with:
          name: resolution-review-input
          path: review-input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read review settings from config.yaml
        id: settings
        run: |
          pip install --quiet pyyaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open(".if-fork/config.yaml"))
          print(f"model={c['claude_models']['resolution_review']}")
          print(f"reviewer_id={c['claude_models']['resolution_review']}-resolution-review")
          print(f"max_turns={c['claude_limits']['max_turns_resolution_review']}")
          PY

      - name: Load resolution-review prompt
        id: load-prompt
        env:
          REVIEWER_ID: ${{ steps.settings.outputs.reviewer_id }}
        run: |
          mkdir -p review-output
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/resolution-review.md
            echo
            echo '## Run inputs'
            echo
            echo "- Upstream PR: $PR_NUMBER (https://github.com/dotnet/wpf/pull/$PR_NUMBER)"
            echo "- Approved upstream head SHA: $PINNED_HEAD_SHA"
            echo "- BASE_SHA (pinned if/main): $BASE_SHA"
            echo "- BRANCH_SHA (commit under review): $BRANCH_SHA"
            echo "- Reviewer ID: $REVIEWER_ID"
            echo "- Verdict file: review-output/resolution.json"
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      # Trusted settings only, as in pr-review.yml: the user settings the
      # action writes (hooks off), no project settings and no MCP servers but
      # the action's own. A double slash is an absolute path in a rule.
      # Claude Code checks Write against the Edit rules.
      - name: Review the resolution
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: initial-force-wpf-bot
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          settings: '{"disableAllHooks": true}'
          claude_args: >-
            --setting-sources user
            --strict-mcp-config
            --max-turns ${{ steps.settings.outputs.max_turns }}
            --model ${{ steps.settings.outputs.model }}
            --allowedTools "Read(./review-input/**),Read(./.if-fork/config.yaml),Edit(./review-output/resolution.json)"
            --disallowedTools "Bash,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Glob,Grep,Read(//proc/**),Read(//home/runner/work/_temp/**),Edit(//home/runner/work/_temp/**)"
          github_token: ${{ github.token }}

      # The hash goes to record-resolution-verdict as a job output, which no
      # other job can set, so a verdict file swapped in by another job is
      # caught.
      - name: Hash the verdict
        id: verdict
        if: always()
        run: |
          F=review-output/resolution.json
          if [ -f "$F" ] && [ ! -L "$F" ]; then
            echo "sha256=$(sha256sum "$F" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the verdict
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolution-verdict.json
          path: review-output/resolution.json
          retention-days: 30
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Job 9: record-resolution-verdict. Trusted. Check the verdict's origin,
  # apply the code rules and record resolution_approved or
  # resolution_rejected for the exact branch commit. Runs when the review
  # failed too: no valid verdict is a rejection.
  # -------------------------------------------------------------------------
  record-resolution-verdict:
    name: Record the resolution review
    needs: [gate, cherry-pick, finalize, prepare-resolution-review, review-resolution]
    if: >-
      always() && needs.gate.outputs.proceed == 'true' &&
      needs.finalize.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      approved: ${{ steps.record.outputs.approved }}
      reason: ${{ steps.record.outputs.reason }}
    env:
      BASE_SHA: ${{ needs.cherry-pick.outputs.main_sha }}
      BRANCH_SHA: ${{ needs.finalize.outputs.branch_sha }}
      BRANCH: ${{ needs.cherry-pick.outputs.branch }}

    steps:
      - name: Validate payload
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BRANCH_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BRANCH" == "claude/cherry-pick-pr-$PR_NUMBER" ]] \
            || { echo "::error::Invalid pr_number, head_sha, SHAs or branch"; exit 1; }

      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: if/main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      # Exact artifact name; a pattern could let another artifact stand in.
      - name: Download the verdict
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: resolution-verdict.json
          path: ${{ runner.temp }}/verdict/

      # Only the counts of the novel-lines report go into the ledger.
      - name: Download the review input
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: resolution-review-input
          path: ${{ runner.temp }}/review-input/

      # The hard-fail scan runs on the diff of the pushed commit, recomputed
      # here, not on the artifact.
      - name: Recompute the branch diff
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA" "$BRANCH_SHA"
          PARENTS=$(git cat-file -p "$BRANCH_SHA" | sed -n 's/^parent //p')
          [ "$PARENTS" = "$BASE_SHA" ] \
            || { echo "::error::$BRANCH_SHA is not one commit on $BASE_SHA"; exit 1; }
          git diff --no-color --no-ext-diff --no-renames "$BASE_SHA" "$BRANCH_SHA" \
            > "$RUNNER_TEMP/final.diff"

      # Exits 0 approved, 1 rejected, 3 error. The reviewer ID comes from the
      # config here, not from the review job, so a review job that never ran
      # cannot leave the check empty.
      - name: Apply the rules
        id: decide
        env:
          VERDICT_SHA256: ${{ needs.review-resolution.outputs.verdict_sha256 }}
          UPLOAD: ${{ needs.review-resolution.outputs.upload }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MODEL=$(python3 -c "import yaml; print(yaml.safe_load(open('.if-fork/config.yaml'))['claude_models']['resolution_review'])")
          set +e
          python tools/record-resolution-verdict.py \
            --verdict "$RUNNER_TEMP/verdict/resolution.json" \
            --reviewer-id "$MODEL-resolution-review" \
            --verdict-sha256 "$VERDICT_SHA256" \
            --upload "$UPLOAD" \
            --config .if-fork/config.yaml \
            --final-diff "$RUNNER_TEMP/final.diff" \
            --novel-lines "$RUNNER_TEMP/review-input/novel-lines.json" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PINNED_HEAD_SHA" \
            --branch-sha "$BRANCH_SHA" \
            --branch "$BRANCH" \
            --run-url "$RUN_URL" \
            --output "$RUNNER_TEMP/decision.json" \
            --events-out "$RUNNER_TEMP/resolution-events.jsonl"
          rc=$?
          set -e
          case "$rc" in
            0) echo "decision=approved" >> "$GITHUB_OUTPUT" ;;
            1) echo "decision=rejected" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::record-resolution-verdict.py failed (exit $rc)"; exit 1 ;;
          esac

      - name: Record in ledger
        env:
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DECISION: ${{ steps.decide.outputs.decision }}
        run: |
          python tools/ledger-event.py \
            --events-file "$RUNNER_TEMP/resolution-events.jsonl" \
            --actor pr-ingestion \
            --message "ledger: resolution pr#$PR_NUMBER $DECISION" \
            --push

      # Only after the ledger commit is pushed: open-pr drops
      # needs-human-merge on approved == true.
      - name: Publish the decision
        id: record
        env:
          DECISION: ${{ steps.decide.outputs.decision }}
        run: |
          REASON=$(jq -r '.reasons | join("; ")' "$RUNNER_TEMP/decision.json" | tr -d '\r\n' | head -c 500)
          {
            if [ "$DECISION" = approved ]; then echo "approved=true"; else echo "approved=false"; fi
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Resolution of upstream #$PR_NUMBER at $BRANCH_SHA: $DECISION. $REASON"

  # -------------------------------------------------------------------------
  # Job 10: open-pr — open (or reuse) the PR to if/main, emit ledger event
  # -------------------------------------------------------------------------
  open-pr:
    name: Open internal PR
    needs: [gate, cherry-pick, finalize, record-resolution-verdict]
    if: >-
      always() && needs.gate.outputs.proceed == 'true' &&
      (needs.cherry-pick.outputs.pushed == 'true' || needs.finalize.outputs.pushed == 'true')
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      internal_pr_number: ${{ steps.open-pr.outputs.pr_number }}

    steps:
      - name: Validate payload
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && [[ "$PINNED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid pr_number or head_sha"; exit 1; }

      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: if/main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Open internal PR
        id: open-pr
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          NEEDS_HUMAN=false
          if [ "$CONFLICT_RESOLVED" = true ] && [ "$RESOLUTION_APPROVED" = true ]; then
            MERGE_NOTE="The cherry-pick conflicted with the fork, and Claude wrote the resolution (commit trailer \`Conflict-Resolved-By: claude\`). A separate review of that resolution (\`resolution-review.md\`) approved commit \`$BRANCH_SHA\`, and the ledger records it as \`resolution_approved\`. When \`Build\` passes, \`automerge.yml\` merges this PR. A new push to the branch needs a new review."
          elif [ "$CONFLICT_RESOLVED" = true ]; then
            NEEDS_HUMAN=true
            MERGE_NOTE="**A person must merge this PR.** The cherry-pick conflicted with the fork, and Claude wrote the resolution (commit trailer \`Conflict-Resolved-By: claude\`). The review of that resolution did not approve it: ${RESOLUTION_REASON:-the review did not finish}. \`automerge.yml\` will not merge this PR. Review the resolved files against the upstream PR, then merge it by hand when \`Build\` passes."
          else
            MERGE_NOTE="The \`Build\` workflow runs on this PR. When it passes, \`automerge.yml\` merges this PR (unless \`IF_AUTOMERGE_FROZEN=true\`)."
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated cherry-pick of https://github.com/dotnet/wpf/pull/$PR_NUMBER.

          Reviewed and approved upstream head: \`$PINNED_HEAD_SHA\`. Passed: pre-flight, approval check against the ledger, commit and file denylists (if/main's copies).

          $MERGE_NOTE

          Run: $RUN_URL
          EOF
          PR_NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" \
                     --base if/main --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr edit "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md"
            gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" \
              --body "Branch re-applied from upstream head \`$PINNED_HEAD_SHA\`. Run: $RUN_URL"
          else
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base if/main --head "$BRANCH" \
              --title "cherry-pick: $UPSTREAM_TITLE (upstream #$PR_NUMBER)" \
              --body-file "$RUNNER_TEMP/pr-body.md")
            PR_NUM="${PR_URL##*/}"
          fi
          gh pr edit "$PR_NUM" --repo "$GITHUB_REPOSITORY" --add-label automated \
            || echo "::warning::Could not add label 'automated' to PR #$PR_NUM; automerge.yml will skip it."
          bash tools/human-merge-label.sh "$PR_NUM" "$NEEDS_HUMAN"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "::notice::Internal PR #$PR_NUM"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.cherry-pick.outputs.branch }}
          UPSTREAM_TITLE: ${{ needs.cherry-pick.outputs.title }}
          CONFLICT_RESOLVED: ${{ needs.finalize.outputs.pushed == 'true' }}
          BRANCH_SHA: ${{ needs.finalize.outputs.branch_sha }}
          RESOLUTION_APPROVED: ${{ needs.record-resolution-verdict.outputs.approved == 'true' }}
          RESOLUTION_REASON: ${{ needs.record-resolution-verdict.outputs.reason }}

      - name: Emit cherry_picked ledger event
        run: |
          python tools/ledger-event.py \
            --event cherry_picked \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PINNED_HEAD_SHA" \
            --actor pr-ingestion \
            --details-json "{\"internal_pr\": \"$INTERNAL_PR\", \"branch\": \"$BRANCH\"}" \
            --push
        env:
          INTERNAL_PR: ${{ steps.open-pr.outputs.pr_number }}
          BRANCH: ${{ needs.cherry-pick.outputs.branch }}
