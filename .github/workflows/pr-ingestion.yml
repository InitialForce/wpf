# .github/workflows/pr-ingestion.yml
#
# Applies one approved upstream dotnet/wpf PR to the fork and opens a PR to
# if/main. Triggered by pr-review.yml (tools/dispatch-approved.py sends
# repository_dispatch "pr-ingestion-requested" with pr_number and head_sha) or
# by hand.
#
# Flow: gate -> pre-flight (already in the fork?) -> SHA-smuggling check
# (head_sha must match the reviewed SHA in the ledger) -> cherry-pick onto a
# branch from if/main (Claude resolves conflicts that are not denylisted) ->
# file denylist on the whole diff -> open or reuse the PR to if/main.
# build.yml runs on that PR (build, smoke, perf); automerge.yml merges it when
# the build passes and IF_AUTOMERGE_FROZEN is not "true".
name: PR Ingestion (Cherry-Pick)

on:
  repository_dispatch:
    types: [pr-ingestion-requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Upstream PR number to cherry-pick"
        required: true
        type: string
      head_sha:
        description: "Expected upstream HEAD SHA (pinned at review time)"
        required: true
        type: string

concurrency:
  group: ingestion-${{ inputs.pr_number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  PR_NUMBER: ${{ inputs.pr_number || github.event.client_payload.pr_number }}
  PINNED_HEAD_SHA: ${{ inputs.head_sha || github.event.client_payload.head_sha }}
  UPSTREAM_REPO: dotnet/wpf

# ---------------------------------------------------------------------------
# Job 1: gate — autonomy-check (reusable workflow)
# ---------------------------------------------------------------------------
jobs:
  gate:
    name: Autonomy gate
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: cherry-pick

  # -------------------------------------------------------------------------
  # Job 2: pre-flight — graduation check before we apply anything
  # -------------------------------------------------------------------------
  pre-flight:
    name: Pre-flight graduation check
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      action: ${{ steps.check.outputs.action }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/dotnet/wpf.git || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Run cherry-pick-pre-flight.sh
        id: check
        run: |
          # The script exits 2 on partial graduation; capture it instead of
          # letting bash -e end the step before the action is recorded.
          set +e
          RESULT=$(bash tools/cherry-pick-pre-flight.sh \
            --pr-number "${{ env.PR_NUMBER }}" \
            --head-sha "${{ env.PINNED_HEAD_SHA }}" \
            --upstream-ref upstream \
            --ledger-path .if-fork/patch-ledger.jsonl)
          RC=$?
          set -e
          echo "$RESULT"
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "::error::Pre-flight failed (exit $RC)."
            exit 1
          fi
          ACTION=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Pre-flight result: $ACTION"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Handle graduated — end workflow (no work needed)
        if: steps.check.outputs.action == 'skip'
        run: |
          echo "::notice::PR #${{ env.PR_NUMBER }} is already graduated — nothing to do."

      - name: Handle partial graduation — stop for a human
        if: steps.check.outputs.action == 'escalate'
        run: |
          # The pre-flight script already recorded an 'escalated' ledger event.
          echo "::error::Upstream PR #${{ env.PR_NUMBER }} is partly in the fork already. A human must decide what to apply."
          exit 1

  # -------------------------------------------------------------------------
  # Job 3: sha-smuggling-check — verify HEAD SHA matches ledger
  # -------------------------------------------------------------------------
  sha-smuggling-check:
    name: SHA-smuggling check
    needs: [gate, pre-flight]
    if: needs.gate.outputs.proceed == 'true' && needs.pre-flight.outputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Verify upstream HEAD SHA matches ledger
        id: verify-sha
        run: |
          # Read the most recent review_1 or review_2 entry for this PR from the ledger.
          # The ledger is a JSONL file at .if-fork/patch-ledger.jsonl.
          # If there is no review entry, we FAIL — we must not proceed without one.
          set +e
          LEDGER_SHA=$(python3 - <<'PYEOF'
          import json, sys

          pr = int("${{ env.PR_NUMBER }}")
          ledger_path = ".if-fork/patch-ledger.jsonl"

          review_sha = None
          try:
              with open(ledger_path) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      entry = json.loads(line)
                      if entry.get("pr_number") == pr and entry.get("event") in ("review_1", "review_2"):
                          review_sha = entry.get("head_sha")
          except FileNotFoundError:
              print("ERROR: ledger file not found", file=sys.stderr)
              sys.exit(1)

          if review_sha is None:
              print("ERROR: no review_1/review_2 entry found in ledger for PR", pr, file=sys.stderr)
              sys.exit(2)

          print(review_sha)
          PYEOF
          )
          PYEXIT=$?
          set -e
          if [ $PYEXIT -ne 0 ]; then
            echo "::error::Ledger lookup failed (exit $PYEXIT) — no review entry found for PR #${{ env.PR_NUMBER }}. Refusing to proceed."
            python tools/ledger-event.py \
              --event escalated \
              --pr-number "${{ env.PR_NUMBER }}" \
              --head-sha "${{ env.PINNED_HEAD_SHA }}" \
              --actor "${{ github.actor }}" \
              --details-json '{"reason": "sha_smuggling_detected", "cause": "no_review_entry_in_ledger"}' \
              --push
            exit 1
          fi

          echo "Ledger SHA: $LEDGER_SHA"
          echo "Pinned SHA (input): ${{ env.PINNED_HEAD_SHA }}"

          if [ "${{ env.PINNED_HEAD_SHA }}" != "$LEDGER_SHA" ]; then
            echo "::error::SHA mismatch — SHA-smuggling attack detected!"
            echo "  Ledger:  $LEDGER_SHA"
            echo "  Pinned:  ${{ env.PINNED_HEAD_SHA }}"
            python tools/ledger-event.py \
              --event escalated \
              --pr-number "${{ env.PR_NUMBER }}" \
              --head-sha "${{ env.PINNED_HEAD_SHA }}" \
              --actor "${{ github.actor }}" \
              --details-json "{\"reason\": \"sha_smuggling_detected\", \"ledger_sha\": \"$LEDGER_SHA\", \"pinned_sha\": \"${{ env.PINNED_HEAD_SHA }}\"}" \
              --push
            exit 1
          fi

          echo "::notice::SHA verification passed — pinned SHA matches ledger."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # -------------------------------------------------------------------------
  # Job 4: cherry-pick — apply the upstream change on a branch from if/main
  # -------------------------------------------------------------------------
  cherry-pick:
    name: Cherry-pick PR #${{ github.event.client_payload.pr_number || inputs.pr_number }}
    needs: [gate, sha-smuggling-check]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      branch: ${{ steps.set-branch.outputs.branch }}
      title: ${{ steps.apply.outputs.title }}
      pushed: ${{ steps.push.outputs.pushed }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: if/main
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/dotnet/wpf.git || true
          git fetch --no-tags upstream main "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set cherry-pick branch name
        id: set-branch
        run: |
          BRANCH="claude/cherry-pick-pr-${{ env.PR_NUMBER }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "CHERRY_PICK_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Apply upstream change
        id: apply
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/upr.json"
          UP_HEAD=$(jq -r .head.sha "$RUNNER_TEMP/upr.json")
          MERGED=$(jq -r .merged "$RUNNER_TEMP/upr.json")
          MERGE_SHA=$(jq -r '.merge_commit_sha // empty' "$RUNNER_TEMP/upr.json")
          TITLE=$(jq -r .title "$RUNNER_TEMP/upr.json")
          AUTHOR=$(jq -r .user.login "$RUNNER_TEMP/upr.json")
          {
            echo 'title<<__EOF_TITLE__'
            echo "$TITLE"
            echo '__EOF_TITLE__'
          } >> "$GITHUB_OUTPUT"

          if [ "$UP_HEAD" != "$PINNED_HEAD_SHA" ]; then
            echo "::error::Upstream PR #$PR_NUMBER head is $UP_HEAD, but the reviewed SHA is $PINNED_HEAD_SHA. The PR changed after review; it needs a new review."
            echo "reason=head_moved_after_review" >> "$GITHUB_OUTPUT"
            echo "result=refused" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A merged PR is applied as its upstream merge commit (dotnet/wpf
          # squash-merges), which keeps the "(cherry picked from commit ...)"
          # trailer. An open PR is applied as its net diff from upstream main.
          if [ "$MERGED" = "true" ] && [ -n "$MERGE_SHA" ]; then
            SOURCE="$MERGE_SHA"
            git fetch --no-tags upstream "$MERGE_SHA"
          else
            SOURCE="$PINNED_HEAD_SHA"
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

          for sha in "$SOURCE" "$PINNED_HEAD_SHA"; do
            if ! python3 tools/check-commit-denylist.py "$sha" --config .if-fork/config.yaml; then
              echo "::error::$sha is on commit_denylist in .if-fork/config.yaml."
              echo "reason=commit_denylist" >> "$GITHUB_OUTPUT"
              echo "result=refused" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          git checkout -B "$CHERRY_PICK_BRANCH" origin/if/main
          PICK_ARGS=(-x)
          if [ "$SOURCE" != "$MERGE_SHA" ]; then
            # Squash the open PR into one synthetic commit on its upstream
            # base so cherry-pick can do a real 3-way merge, including
            # modify/delete conflicts that 'git apply -3' cannot record.
            BASE=$(git merge-base "$PINNED_HEAD_SHA" upstream/main)
            SOURCE=$(GIT_AUTHOR_NAME="$AUTHOR" GIT_AUTHOR_EMAIL="$AUTHOR@users.noreply.github.com" \
              git commit-tree "$PINNED_HEAD_SHA^{tree}" -p "$BASE" -m "$TITLE (dotnet/wpf#$PR_NUMBER)")
            PICK_ARGS=()
          elif [ "$(git rev-list --parents -n 1 "$SOURCE" | wc -w)" -gt 2 ]; then
            PICK_ARGS+=(-m 1)
          fi
          if git cherry-pick "${PICK_ARGS[@]}" "$SOURCE"; then
            echo "result=applied" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          if [ ! -s "$RUNNER_TEMP/conflicts.txt" ]; then
            if git diff --cached --quiet; then
              echo "::notice::The change is already in if/main (empty cherry-pick)."
              echo "result=empty" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Applying failed without conflicts."
              echo "reason=apply_failed" >> "$GITHUB_OUTPUT"
              echo "result=refused" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "result=conflict" >> "$GITHUB_OUTPUT"
          {
            echo 'files<<__EOF_FILES__'
            cat "$RUNNER_TEMP/conflicts.txt"
            echo '__EOF_FILES__'
          } >> "$GITHUB_OUTPUT"
          echo "::warning::Conflicts: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Refuse conflicts on denylisted files
        id: conflict-denylist
        if: steps.apply.outputs.result == 'conflict'
        run: |
          if python3 tools/check-denylist.py --config .if-fork/config.yaml \
               --changed-files "$RUNNER_TEMP/conflicts.txt"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load cherry-pick conflict prompt
        id: load-prompt-pick
        if: steps.conflict-denylist.outputs.allowed == 'true'
        shell: bash
        run: |
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/cherry-pick.md
            echo
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve conflicts (Claude Sonnet)
        id: pick
        if: steps.conflict-denylist.outputs.allowed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt-pick.outputs.prompt }}
          claude_args: >-
            --max-turns 30
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,Edit,Write,Grep
            --disallowedTools mcp__github__push_files,mcp__github__create_pull_request
          github_token: ${{ steps.app-token.outputs.token }}
        env:
          CONFIG_PATH: .if-fork/config.yaml
          PR_NUMBER: ${{ env.PR_NUMBER }}
          PINNED_HEAD_SHA: ${{ env.PINNED_HEAD_SHA }}
          SOURCE_SHA: ${{ steps.apply.outputs.source }}
          CONFLICT_FILES: ${{ steps.apply.outputs.files }}
          ESCALATION_ISSUE_PATH: ${{ runner.temp }}/escalation.md

      - name: Finish the commit after conflict resolution
        id: finish
        if: steps.conflict-denylist.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/escalation.md" ]; then
            cat "$RUNNER_TEMP/escalation.md"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -e "$f" ] && grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- "$f"; then
              echo "::error::Conflict markers remain in $f"
              echo "resolved=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < "$RUNNER_TEMP/conflicts.txt"
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -e "$f" ]; then git add -- "$f"; else git rm -q --cached --ignore-unmatch -- "$f"; fi
          done < "$RUNNER_TEMP/conflicts.txt"
          if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; then
            GIT_EDITOR=true git cherry-pick --continue
          fi
          echo "resolved=true" >> "$GITHUB_OUTPUT"

      - name: Add upstream trailers and push branch
        id: push
        if: steps.apply.outputs.result == 'applied' || steps.finish.outputs.resolved == 'true'
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count origin/if/main..HEAD)" -ne 1 ]; then
            echo "::error::Expected exactly one new commit on $CHERRY_PICK_BRANCH."
            exit 1
          fi
          git commit --amend --no-edit \
            --trailer "Upstream-PR: https://github.com/$UPSTREAM_REPO/pull/$PR_NUMBER" \
            --trailer "Upstream-PR-Head: $PINNED_HEAD_SHA"
          git push --force-with-lease origin "HEAD:refs/heads/$CHERRY_PICK_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Record already-applied change
        if: steps.apply.outputs.result == 'empty'
        run: |
          git cherry-pick --abort 2>/dev/null || true
          git checkout -q -B if/main origin/if/main
          python tools/ledger-event.py \
            --event graduated_upstream \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PINNED_HEAD_SHA" \
            --actor pr-ingestion \
            --details-json '{"detection_method":"empty_cherry_pick"}' \
            --push

      - name: Escalate when the change could not be applied
        if: >-
          steps.apply.outputs.result == 'refused' ||
          steps.conflict-denylist.outputs.allowed == 'false' ||
          steps.finish.outputs.resolved == 'false'
        run: |
          set -euo pipefail
          REASON="${APPLY_REASON:-}"
          if [ -z "$REASON" ]; then
            if [ "$DENIED" = "false" ]; then REASON=conflict_in_denylist; else REASON=cherry_pick_conflict; fi
          fi
          git cherry-pick --abort 2>/dev/null || true
          git reset -q --hard
          git checkout -q -B if/main origin/if/main
          python tools/ledger-event.py \
            --event escalated \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PINNED_HEAD_SHA" \
            --actor pr-ingestion \
            --details-json "{\"reason\":\"$REASON\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            --push
          {
            echo "### Upstream PR #$PR_NUMBER was not applied"
            echo
            echo "Reason: \`$REASON\`"
            cat "$RUNNER_TEMP/escalation.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream PR #$PR_NUMBER needs a human: $REASON"
          exit 1
        env:
          APPLY_REASON: ${{ steps.apply.outputs.reason }}
          DENIED: ${{ steps.conflict-denylist.outputs.allowed }}

  # -------------------------------------------------------------------------
  # Job 5: denylist-check — check every changed file against file_denylist
  # -------------------------------------------------------------------------
  denylist-check:
    name: Denylist check
    needs: [gate, cherry-pick]
    if: needs.gate.outputs.proceed == 'true' && needs.cherry-pick.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cherry-pick.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch if/main base
        run: git fetch origin if/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run denylist check
        id: denylist
        run: |
          git diff --name-only origin/if/main...HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Changed files:"
          cat "$RUNNER_TEMP/changed.txt"
          python3 tools/check-denylist.py \
            --config .if-fork/config.yaml \
            --changed-files "$RUNNER_TEMP/changed.txt"

  # -------------------------------------------------------------------------
  # Job 6: open-pr — open (or reuse) the PR to if/main, emit ledger event
  # -------------------------------------------------------------------------
  open-pr:
    name: Open internal PR
    needs: [gate, cherry-pick, denylist-check]
    if: needs.gate.outputs.proceed == 'true' && needs.cherry-pick.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      internal_pr_number: ${{ steps.open-pr.outputs.pr_number }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: if/main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Open internal PR
        id: open-pr
        run: |
          set -euo pipefail
          BRANCH="${{ needs.cherry-pick.outputs.branch }}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PR_NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" \
                     --base if/main --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" \
              --body "Branch re-applied from upstream head \`$PINNED_HEAD_SHA\`. Run: $RUN_URL"
          else
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base if/main --head "$BRANCH" \
              --title "cherry-pick: $UPSTREAM_TITLE (upstream #$PR_NUMBER)" \
              --body "Automated cherry-pick of https://github.com/$UPSTREAM_REPO/pull/$PR_NUMBER.

          Reviewed upstream head: \`$PINNED_HEAD_SHA\`. Passed: pre-flight, SHA check against the ledger, commit and file denylists.

          The \`Build\` workflow runs on this PR (build, smoke, perf). When it passes, \`automerge.yml\` merges this PR (unless \`IF_AUTOMERGE_FROZEN=true\`).

          Run: $RUN_URL")
            PR_NUM="${PR_URL##*/}"
          fi
          gh pr edit "$PR_NUM" --repo "$GITHUB_REPOSITORY" --add-label automated \
            || echo "::warning::Could not add label 'automated' to PR #$PR_NUM; automerge.yml will skip it."
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "::notice::Internal PR #$PR_NUM"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_TITLE: ${{ needs.cherry-pick.outputs.title }}

      - name: Emit cherry_picked ledger event
        run: |
          python tools/ledger-event.py \
            --event cherry_picked \
            --pr-number "${{ env.PR_NUMBER }}" \
            --head-sha "${{ env.PINNED_HEAD_SHA }}" \
            --actor pr-ingestion \
            --details-json "{\"internal_pr\": \"${{ steps.open-pr.outputs.pr_number }}\", \"branch\": \"${{ needs.cherry-pick.outputs.branch }}\"}" \
            --push
