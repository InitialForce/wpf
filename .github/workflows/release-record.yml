# .github/workflows/release-record.yml
#
# Writes the ledger "published" event after release.yml published a tag.
# release.yml does not hold the bot signing key or the App token, so this
# step lives here. workflow_run always runs this file from the default branch
# (if/main), never from the tag.
name: Release Record

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: release-record
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    name: Record published ledger event
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Find the released tag
        id: tag
        env:
          # release.yml sets run-name to "Release <tag>".
          TITLE: ${{ github.event.workflow_run.display_title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${TITLE#Release }"
          if [[ ! "$TAG" =~ ^if-[0-9]+\.[0-9]+\.[0-9]+-perf\.[0-9]{8}(\.[0-9]+)?$ ]]; then
            echo "::error::Run title does not name a release tag"
            exit 1
          fi
          # A Release run can succeed without publishing (for example when the
          # autonomy gate is off). Only a GitHub Release means it published.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::No GitHub Release for $TAG; nothing was published, nothing to record."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Generate GH App token
        if: steps.tag.outputs.tag != ''
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # The ledger lives on if/main; ledger-event.py commits and pushes there.
      - uses: actions/checkout@v4
        if: steps.tag.outputs.tag != ''
        with:
          ref: if/main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        if: steps.tag.outputs.tag != ''
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Emit published ledger event
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"
        run: |
          set -euo pipefail
          if grep -F '"event":"published"' .if-fork/patch-ledger.jsonl | grep -qF "\"tag\":\"$TAG\""; then
            echo "Ledger already records $TAG as published."
            exit 0
          fi
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          VERSION=$(python3 tools/release-version.py version --tag "$TAG")
          # CRIT-2: pr-number=0 is the ledger's "no PR" sentinel for releases.
          python tools/ledger-event.py \
            --event published \
            --pr-number 0 \
            --head-sha "$TAG_SHA" \
            --actor release \
            --details-json "{\"tag\":\"$TAG\",\"version\":\"$VERSION\"}" \
            --push
        shell: bash
