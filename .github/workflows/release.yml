# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "if-10.0.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. if-10.0.8-perf.20261008. Run on that tag: gh workflow run release.yml --ref <tag> -f tag=<tag>"
        required: true
        type: string
      regenerate_perf_baseline:
        description: "Also regenerate perf/baseline.json from this build's package (uploaded as an artifact to commit manually)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: gate — autonomy-check (requested_action: release-publish)
  # ---------------------------------------------------------------------------
  gate:
    name: Autonomy gate (release-publish)
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: release-publish

  # ---------------------------------------------------------------------------
  # Job 2: verify-tag — bot-signed tag on a commit reachable from if/main
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify tag signature and reachability
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag_sha: ${{ steps.verify.outputs.tag_sha }}
      nuget_version: ${{ steps.verify.outputs.nuget_version }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify tag is bot-signed and reachable from if/main
        id: verify
        env:
          GH_BOT_GPG_KEY: ${{ secrets.GH_BOT_GPG_KEY }}
          GH_BOT_GPG_FINGERPRINT: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          TAG="${{ env.TAG_NAME }}"
          echo "Verifying tag: $TAG"

          # LOW-3: validate the tag format and derive the NuGet version from it.
          # The version depends only on the tag, so a re-run packs the same version.
          if [[ ! "$TAG" =~ ^if-10\.0\..+ ]]; then
            echo "::error::Invalid tag format: '$TAG'. Expected pattern: if-10.0.<suffix>"
            exit 1
          fi
          VERSION=$(python3 tools/release-version.py version --tag "$TAG") || {
            echo "::error::Invalid tag format: '$TAG'. Expected if-<x.y.z>-perf.<yyyymmdd>[.<rev>]"
            exit 1
          }

          # build.yml checks out github.ref, so the run must be on the tag itself.
          if [ "${{ github.ref }}" != "refs/tags/$TAG" ]; then
            echo "::error::Run release.yml on the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi

          # Re-fetch the tag object: actions/checkout can replace an annotated
          # tag with a lightweight ref on tag-push events, which drops the signature.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

          # HIGH-7: the tag must be signed by the bot key (auto-release.yml
          # creates it). Import only that key, then require a valid signature
          # whose fingerprint matches it.
          printf '%s' "$GH_BOT_GPG_KEY" | gpg --batch --import 2>/dev/null
          STATUS=$(git verify-tag --raw "$TAG" 2>&1) || {
            echo "$STATUS"
            echo "::error::Unsigned or invalid tag: $TAG"
            exit 1
          }
          if ! grep -Eq "^\[GNUPG:\] VALIDSIG .*${GH_BOT_GPG_FINGERPRINT}" <<<"$STATUS"; then
            echo "::error::Tag $TAG is not signed by the bot key"
            exit 1
          fi

          # Releases are cut from if/main (the branch every gate runs on).
          git fetch origin if/main
          TAG_COMMIT=$(git rev-list -n1 "refs/tags/$TAG^{}")
          git merge-base --is-ancestor "$TAG_COMMIT" origin/if/main || {
            echo "::error::Tag not reachable from if/main"
            exit 1
          }

          echo "tag_sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "nuget_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG verified: commit=$TAG_COMMIT, NuGet version $VERSION"
        shell: bash

  # ---------------------------------------------------------------------------
  # Job 3: build — the full build.yml gate set (lint, build, crossgen, pack,
  # smoke on the packed nupkg, anti-stub, aggregate), packed with the release
  # version. The packages are in this run's build-x64 artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Build, pack and smoke
    needs: verify-tag
    if: needs.verify-tag.result == 'success'
    uses: ./.github/workflows/build.yml
    with:
      package_version: ${{ needs.verify-tag.outputs.nuget_version }}

  # ---------------------------------------------------------------------------
  # Job 4: perf-on-pack — run perf harness, check regression against baseline
  # ---------------------------------------------------------------------------
  perf-on-pack:
    name: Perf regression check against packed NuGet
    needs: [verify-tag, build]
    if: needs.build.result == 'success'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: /tmp/build/

      - name: Run BenchmarkDotNet perf harness against packed nupkg
        run: |
          $feedDir = "/tmp/local-feed"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Get-ChildItem /tmp/build -Recurse -Filter '*.nupkg' | Copy-Item -Destination $feedDir

          $ver = "${{ needs.verify-tag.outputs.nuget_version }}"
          if (-not $ver) { throw "nuget_version output is empty — cannot resolve InitialForceWpfVersion." }
          $proj = "test/InitialForce.WpfSmoke/Perf/InitialForce.WpfPerf.csproj"

          dotnet nuget add source $feedDir --name local-packed --configfile NuGet.config
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.config
          dotnet restore $proj `
            -p:InitialForceWpfVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }

          # Standalone BenchmarkDotNet console harness (NOT the NUnit stubs).
          dotnet run -c Release --no-restore --project $proj `
            -p:InitialForceWpfVersion=$ver `
            -- --filter '*' --exporters json --artifacts /tmp/bdn-artifacts
          if ($LASTEXITCODE -ne 0) { throw "BenchmarkDotNet run failed" }

          $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*-report-full-compressed.json' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $json) {
            $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*.json' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if (-not $json) { throw "No BenchmarkDotNet JSON export produced under /tmp/bdn-artifacts." }
          New-Item -ItemType Directory -Force -Path perf | Out-Null
          Copy-Item $json.FullName perf/current.json -Force
          Write-Host "Wrote perf/current.json from $($json.FullName)"
        shell: pwsh

      - name: Check perf regression (hard on Allocated, warn-only on time)
        run: |
          python tools/check-regression.py `
            --current perf/current.json `
            --baseline perf/baseline.json `
            --current-sha ${{ github.sha }} `
            --output /tmp/perf-result.json `
            --threshold-warn 5 `
            --threshold-fail 15 `
            --warn-only-metrics Mean
        shell: pwsh

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ needs.verify-tag.outputs.nuget_version }}
          path: /tmp/perf-result.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 5b: regenerate-perf-baseline — operator-driven refresh of the checked-in
  # perf/baseline.json from this build's package. Runs only when dispatched with
  # regenerate_perf_baseline=true. The refreshed baseline is uploaded as an
  # artifact (perf-baseline-<version>) for a human to review and commit; CI does
  # not push to the repo. The seeded perf/baseline.json is a hand-authored
  # placeholder until this job replaces it with real measurements.
  # ---------------------------------------------------------------------------
  regenerate-perf-baseline:
    name: Regenerate perf baseline (manual)
    needs: [verify-tag, build]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.regenerate_perf_baseline &&
      needs.build.result == 'success'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: /tmp/build/

      - name: Run BenchmarkDotNet and capture baseline
        run: |
          $feedDir = "/tmp/local-feed"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Get-ChildItem /tmp/build -Recurse -Filter '*.nupkg' | Copy-Item -Destination $feedDir

          $ver = "${{ needs.verify-tag.outputs.nuget_version }}"
          if (-not $ver) { throw "nuget_version output is empty." }
          $proj = "test/InitialForce.WpfSmoke/Perf/InitialForce.WpfPerf.csproj"

          dotnet nuget add source $feedDir --name local-packed --configfile NuGet.config
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.config
          dotnet restore $proj `
            -p:InitialForceWpfVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }

          dotnet run -c Release --no-restore --project $proj `
            -p:InitialForceWpfVersion=$ver `
            -- --filter '*' --exporters json --artifacts /tmp/bdn-artifacts
          if ($LASTEXITCODE -ne 0) { throw "BenchmarkDotNet run failed" }

          $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*-report-full-compressed.json' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $json) {
            $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*.json' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if (-not $json) { throw "No BenchmarkDotNet JSON export produced." }
          New-Item -ItemType Directory -Force -Path perf | Out-Null
          Copy-Item $json.FullName perf/baseline.json -Force
          Write-Host "Regenerated perf/baseline.json from $($json.FullName)"
          Write-Host "Review and commit this file to update the checked-in baseline."
        shell: pwsh

      - name: Upload regenerated baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ needs.verify-tag.outputs.nuget_version }}
          path: perf/baseline.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 6: release-notes — run Claude to draft GitHub Release notes from ledger
  # ---------------------------------------------------------------------------
  release-notes:
    name: Generate release notes (Claude Sonnet)
    needs: [verify-tag, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      notes_artifact: release-notes-${{ needs.verify-tag.outputs.nuget_version }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine previous tag
        id: prev-tag
        run: |
          CURRENT_TAG="${{ env.TAG_NAME }}"
          PREV_TAG=$(git tag --list 'if-10.0.*' --sort=-version:refname \
            | grep -v "^${CURRENT_TAG}$" | head -1 || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV_TAG"
        shell: bash

      - name: Load release-notes prompt
        id: load-prompt
        shell: bash
        run: |
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/release-notes.md
            echo
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Run release notes prompt (Claude Sonnet)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 10
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,Grep
            --disallowedTools Edit,Write,mcp__github__push_files
          github_token: ${{ steps.app-token.outputs.token }}
        env:
          CONFIG_PATH: .if-fork/config.yaml
          FROM_REF: ${{ steps.prev-tag.outputs.prev_tag }}
          TO_REF: ${{ env.TAG_NAME }}
          VERSION_STRING: ${{ needs.verify-tag.outputs.nuget_version }}
          OUTPUT_PATH: /tmp/release-notes-${{ needs.verify-tag.outputs.nuget_version }}.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ needs.verify-tag.outputs.nuget_version }}
          path: /tmp/release-notes-${{ needs.verify-tag.outputs.nuget_version }}.md
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 7: publish — nuget.org, GitHub Packages, then the GitHub Release.
  # Runs only when build (every build.yml gate, including smoke on the packed
  # nupkg) and perf-on-pack passed. Release notes are optional: if that job
  # fails, the GitHub Release uses generated notes instead.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish NuGets
    needs: [verify-tag, build, perf-on-pack, release-notes]
    if: >-
      !cancelled() &&
      needs.verify-tag.result == 'success' &&
      needs.build.result == 'success' &&
      needs.perf-on-pack.result == 'success'
    runs-on: ubuntu-latest
    environment: wpf-nuget-publish
    env:
      NUGET_VERSION: ${{ needs.verify-tag.outputs.nuget_version }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: /tmp/build/

      - name: Download release notes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.verify-tag.outputs.nuget_version }}
          path: /tmp/

      - name: MED-3 SHA256 cross-check — verify package integrity
        run: |
          set -euo pipefail
          mkdir -p /tmp/packages
          find /tmp/build -name '*.nupkg' -exec cp {} /tmp/packages/ \;
          # Exactly the two packages, both at the version derived from the tag.
          for id in InitialForce.WPF InitialForce.WPF.RuntimeOverride; do
            if [ ! -s "/tmp/packages/$id.$NUGET_VERSION.nupkg" ]; then
              echo "::error::Missing or empty /tmp/packages/$id.$NUGET_VERSION.nupkg"
              ls -l /tmp/packages
              exit 1
            fi
          done
          COUNT=$(find /tmp/packages -name '*.nupkg' | wc -l)
          if [ "$COUNT" -ne 2 ]; then
            echo "::error::Expected 2 packages, found $COUNT"
            ls -l /tmp/packages
            exit 1
          fi
          # Phase-2: integrate SLSA provenance via slsa-framework/slsa-github-generator
          # when org-level SLSA attestation infrastructure is ready.
          sha256sum /tmp/packages/*.nupkg | tee /tmp/publish-sha256.txt
        shell: bash

      - name: Publish to nuget.org
        # --skip-duplicate makes a re-run for the same tag a no-op.
        run: |
          set -euo pipefail
          for pkg in /tmp/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_ORG_API_KEY" \
              --skip-duplicate
          done
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        shell: bash

      - name: Publish to GitHub Packages
        # Use the built-in GITHUB_TOKEN. Workflow already grants
        # packages:write at the top of this file.
        run: |
          set -euo pipefail
          for pkg in /tmp/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/InitialForce/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done
        shell: bash

      - name: Create GitHub Release
        # auto-release.yml treats a tag that has a GitHub Release as
        # published, so this must stay the last publish step.
        run: |
          if gh release view "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
            echo "GitHub Release ${{ env.TAG_NAME }} already exists; nothing to do."
            exit 0
          fi
          NOTES_FILE=$(ls /tmp/release-notes-*.md 2>/dev/null | head -1 || echo "")
          if [ -z "$NOTES_FILE" ]; then
            NOTES_ARGS="--generate-notes"
          else
            NOTES_ARGS="--notes-file $NOTES_FILE"
          fi
          # shellcheck disable=SC2086
          gh release create "${{ env.TAG_NAME }}" \
            --verify-tag \
            --title "InitialForce WPF $NUGET_VERSION" \
            $NOTES_ARGS \
            /tmp/packages/*.nupkg
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash

  # ---------------------------------------------------------------------------
  # Job 8: record — emit published ledger event with version + tag + commit
  # ---------------------------------------------------------------------------
  record:
    name: Record published ledger event
    needs: [verify-tag, build, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # The ledger lives on if/main. Check out the branch, not the tag, so
      # ledger-event.py has a branch to commit and push to.
      - uses: actions/checkout@v4
        with:
          ref: if/main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Emit published ledger event
        run: |
          TAG="${{ env.TAG_NAME }}"
          VERSION="${{ needs.verify-tag.outputs.nuget_version }}"
          # CRIT-2: Use correct ledger-event.py CLI args.
          # pr-number=0 since releases are not tied to PRs; the ledger schema
          # accepts 0 as a synthetic "no PR" sentinel for release events.
          python tools/ledger-event.py \
            --event published \
            --pr-number 0 \
            --head-sha "${{ needs.verify-tag.outputs.tag_sha }}" \
            --actor release \
            --details-json "{\"tag\":\"$TAG\",\"version\":\"$VERSION\"}" \
            --push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"
        shell: bash
