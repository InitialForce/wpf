# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "if-10.0.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. if-10.0.4-perf.20260427)"
        required: true
        type: string
      regenerate_perf_baseline:
        description: "Also regenerate perf/baseline.json from this build's package (uploaded as an artifact to commit manually)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: gate — autonomy-check (requested_action: release-publish)
  # ---------------------------------------------------------------------------
  gate:
    name: Autonomy gate (release-publish)
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: release-publish

  # ---------------------------------------------------------------------------
  # Job 2: verify-tag — signed tag reachable from if/main
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify tag signature and reachability
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag_sha: ${{ steps.verify.outputs.tag_sha }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify tag is signed and reachable from if/release/10.0
        id: verify
        run: |
          TAG="${{ env.TAG_NAME }}"
          echo "Verifying tag: $TAG"

          # LOW-3: Validate tag format
          if [[ ! "$TAG" =~ ^if-10\.0\..+ ]]; then
            echo "::error::Invalid tag format: '$TAG'. Expected pattern: if-10.0.<suffix>"
            exit 1
          fi

          # Verify the tag exists
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG not found in repository"
            exit 1
          fi

          # HIGH-7: Tag signature check temporarily skipped for first release.
          # GPG signing infra to be provisioned in a follow-up; until then the
          # remaining safeguards (denylist hard-fails, smoke-on-pack,
          # perf-on-pack, wpf-nuget-publish env protection, repo write ACL)
          # cover the threat model that signed tags address. Restore before
          # second release.
          # git tag -v "$TAG" || { echo "::error::Unsigned or invalid tag: $TAG"; exit 1; }
          echo "::warning::Tag signature check skipped (TODO: restore once GPG infra is provisioned)"

          # HIGH-7 / MED-3: Verify tag is reachable from if/release/10.0 (not if/main)
          git fetch origin if/release/10.0
          TAG_COMMIT=$(git rev-list -n1 "refs/tags/$TAG^{}")
          git merge-base --is-ancestor "$TAG" origin/if/release/10.0 || { echo "::error::Tag not reachable from if/release/10.0"; exit 1; }

          echo "tag_sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG verified: commit=$TAG_COMMIT is reachable from if/release/10.0"
        shell: bash

  # ---------------------------------------------------------------------------
  # Job 3: build — compute version, dotnet pack both packages, upload artifacts
  # ---------------------------------------------------------------------------
  build:
    name: Build and pack NuGet packages
    needs: verify-tag
    if: needs.verify-tag.result == 'success'
    runs-on: windows-2022
    outputs:
      nuget_version: ${{ steps.version.outputs.nuget_version }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-x64-${{ hashFiles('**/packages.lock.json', 'global.json') }}
          restore-keys: nuget-win-x64-

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute NuGet version
        id: version
        run: |
          # compute-version.ps1 -DryRun emits the version on stdout AND a
          # diagnostic on the Information stream; capturing the subprocess
          # output as a single value merges both, so take only the first
          # line (the actual version string).
          $version = (& pwsh -File tools/compute-version.ps1 -DryRun | Select-Object -First 1).Trim()
          echo "nuget_version=$version" >> "$env:GITHUB_OUTPUT"
          echo "Computed NuGet version: $version"
        shell: pwsh

      - name: Pack InitialForce.WPF
        run: |
          dotnet pack packaging/InitialForce.WPF/InitialForce.WPF.csproj `
            -c Release `
            /p:Version=${{ steps.version.outputs.nuget_version }} `
            /p:RepositoryCommit=${{ needs.verify-tag.outputs.tag_sha }} `
            --output /tmp/packages/
        shell: pwsh

      - name: Pack InitialForce.WPF.RuntimeOverride
        run: |
          dotnet pack packaging/InitialForce.WPF.RuntimeOverride/InitialForce.WPF.RuntimeOverride.csproj `
            -c Release `
            /p:Version=${{ steps.version.outputs.nuget_version }} `
            /p:RepositoryCommit=${{ needs.verify-tag.outputs.tag_sha }} `
            --output /tmp/packages/
        shell: pwsh

      - name: Upload .nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ steps.version.outputs.nuget_version }}
          path: /tmp/packages/**/*.nupkg
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4: smoke-on-pack — install packed nupkg into temp project, run 22 scenarios
  # ---------------------------------------------------------------------------
  smoke-on-pack:
    name: Smoke harness against packed NuGet
    needs: build
    if: needs.build.result == 'success'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.build.outputs.nuget_version }}
          path: /tmp/packages/

      - name: Run smoke harness against packed nupkg
        run: |
          # Local NuGet feed pointing at the downloaded packages.
          $feedDir = "/tmp/local-feed"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Copy-Item /tmp/packages/*.nupkg $feedDir/

          $ver = "${{ needs.build.outputs.nuget_version }}"
          if (-not $ver) { throw "nuget_version output is empty — cannot resolve InitialForceWpfVersion." }
          Write-Host "Consuming InitialForce.WPF $ver from $feedDir"

          dotnet nuget add source $feedDir --name local-packed --configfile NuGet.config
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.config
          dotnet restore test/InitialForce.WpfSmoke/InitialForce.WpfSmoke.csproj `
            -p:InitialForceWpfVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }

          # Publish self-contained win-x64 (the csproj pins the RID + SelfContained),
          # which lays down a full runtime AND the patched WPF DLLs while stripping the
          # stock ones — the exact production consumption path, so the patched WPF loads
          # unambiguously. `dotnet test` cannot run a self-contained testhost from build
          # output (hostpolicy.dll is not laid down there), so run the NUnitLite console
          # entry point directly; it emits NUnit3 result XML.
          dotnet publish test/InitialForce.WpfSmoke/InitialForce.WpfSmoke.csproj `
            -c Release --no-restore `
            -p:InitialForceWpfVersion=$ver `
            -o /tmp/smoke-publish/
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          # The WPF Arcade SDK strips NuGet package assemblies from test-project output,
          # so the NUnit assemblies are absent from the self-contained publish. Copy them
          # from the restored package cache into the app directory; the self-contained host
          # probes the application base directory, so they load without a deps.json entry.
          $gp = ((dotnet nuget locals global-packages --list) -replace '^[^:]*:\s*','').Trim()
          Write-Host "NuGet global packages: $gp"
          foreach ($pkgId in 'nunit','nunitlite') {
            $pkgDir = Join-Path $gp $pkgId
            if (-not (Test-Path $pkgDir)) { throw "package cache missing '$pkgId' under $gp" }
            $verDir = Get-ChildItem $pkgDir -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $libRoot = Join-Path $verDir.FullName 'lib'
            $tfmDir = @('netstandard2.0','net6.0','net462') |
                      ForEach-Object { Join-Path $libRoot $_ } |
                      Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $tfmDir) { throw "no compatible lib TFM for '$pkgId' under $libRoot" }
            Get-ChildItem $tfmDir -Filter '*.dll' | ForEach-Object {
              Copy-Item $_.FullName /tmp/smoke-publish/ -Force
              Write-Host "  copied $($_.Name) from $pkgId ($($verDir.Name))"
            }
          }
          # A self-contained app resolves assemblies strictly from its deps.json TPA and
          # does not probe the app base directory for files absent from it. The WPF Arcade
          # SDK strips the NUnit package assemblies, and the InitialForce.WPF targets strip
          # the patched WPF DLLs, from the generated deps.json (the WPF DLLs are still copied
          # into the app directory by the package targets, just not registered). Register
          # every assembly physically present in the publish directory that deps.json does
          # not already list, so the host resolves them from the app base directory.
          $depsPath = "/tmp/smoke-publish/InitialForce.WpfSmoke.deps.json"
          $deps = Get-Content $depsPath -Raw | ConvertFrom-Json
          $rt = $deps.runtimeTarget.name
          $existing = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($lib in $deps.targets.$rt.PSObject.Properties) {
            $runtime = $lib.Value.runtime
            if ($null -ne $runtime) {
              foreach ($r in $runtime.PSObject.Properties) { [void]$existing.Add([System.IO.Path]::GetFileName($r.Name)) }
            }
          }
          $appProp = $deps.targets.$rt.PSObject.Properties |
                     Where-Object { $_.Name -like 'InitialForce.WpfSmoke/*' } | Select-Object -First 1
          $runtimeObj = $deps.targets.$rt.($appProp.Name).runtime
          $added = 0
          foreach ($f in Get-ChildItem /tmp/smoke-publish -Filter '*.dll') {
            if (-not $existing.Contains($f.Name)) {
              $runtimeObj | Add-Member -NotePropertyName $f.Name -NotePropertyValue ([pscustomobject]@{}) -Force
              [void]$existing.Add($f.Name); $added++
              Write-Host "  deps.json += $($f.Name)"
            }
          }
          Write-Host "Registered $added assemblies in deps.json"
          ($deps | ConvertTo-Json -Depth 100) | Set-Content $depsPath -Encoding utf8
          New-Item -ItemType Directory -Force -Path /tmp/smoke-results | Out-Null
          & "/tmp/smoke-publish/InitialForce.WpfSmoke.exe" --result:"/tmp/smoke-results/smoke.xml"
          $runExit = $LASTEXITCODE
          Write-Host "NUnitLite exit code: $runExit"
          if ($runExit -ne 0) { throw "smoke run reported failures or errors (exit $runExit)" }
        shell: pwsh

      - name: Enforce non-empty smoke run (NUnit3 floor gate)
        if: always()
        run: |
          $floorFile = "test/InitialForce.WpfSmoke/expected-min-tests.txt"
          $floor = [int]((Get-Content $floorFile) |
                   Where-Object { $_ -match '^\s*\d+' } | Select-Object -First 1)
          $xml = Get-ChildItem /tmp/smoke-results -Recurse -Filter '*.xml' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $xml) { Write-Error "No NUnit3 result XML produced — smoke harness did not run."; exit 1 }
          [xml]$doc = Get-Content $xml.FullName
          $run = $doc.'test-run'
          $total = [int]$run.total
          Write-Host "Smoke results total=$total passed=$($run.passed) failed=$($run.failed) (floor=$floor)"
          if ($total -lt $floor) {
            Write-Error "Smoke run reported $total tests, below the floor of $floor."
            exit 1
          }
          if ([int]$run.failed -gt 0) {
            Write-Error "Smoke run reported $($run.failed) failed tests."
            exit 1
          }
        shell: pwsh

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ needs.build.outputs.nuget_version }}
          path: /tmp/smoke-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 5: perf-on-pack — run perf harness, check regression against baseline
  # ---------------------------------------------------------------------------
  perf-on-pack:
    name: Perf regression check against packed NuGet
    needs: build
    if: needs.build.result == 'success'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.build.outputs.nuget_version }}
          path: /tmp/packages/

      - name: Run BenchmarkDotNet perf harness against packed nupkg
        run: |
          $feedDir = "/tmp/local-feed"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Copy-Item /tmp/packages/*.nupkg $feedDir/

          $ver = "${{ needs.build.outputs.nuget_version }}"
          if (-not $ver) { throw "nuget_version output is empty — cannot resolve InitialForceWpfVersion." }
          $proj = "test/InitialForce.WpfSmoke/Perf/InitialForce.WpfPerf.csproj"

          dotnet nuget add source $feedDir --name local-packed --configfile NuGet.config
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.config
          dotnet restore $proj `
            -p:InitialForceWpfVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }

          # Standalone BenchmarkDotNet console harness (NOT the NUnit stubs).
          dotnet run -c Release --no-restore --project $proj `
            -p:InitialForceWpfVersion=$ver `
            -- --filter '*' --exporters json --artifacts /tmp/bdn-artifacts
          if ($LASTEXITCODE -ne 0) { throw "BenchmarkDotNet run failed" }

          $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*-report-full-compressed.json' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $json) {
            $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*.json' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if (-not $json) { throw "No BenchmarkDotNet JSON export produced under /tmp/bdn-artifacts." }
          New-Item -ItemType Directory -Force -Path perf | Out-Null
          Copy-Item $json.FullName perf/current.json -Force
          Write-Host "Wrote perf/current.json from $($json.FullName)"
        shell: pwsh

      - name: Check perf regression (hard on Allocated, warn-only on time)
        run: |
          python tools/check-regression.py `
            --current perf/current.json `
            --baseline perf/baseline.json `
            --current-sha ${{ github.sha }} `
            --output /tmp/perf-result.json `
            --threshold-warn 5 `
            --threshold-fail 15 `
            --warn-only-metrics Mean
        shell: pwsh

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ needs.build.outputs.nuget_version }}
          path: /tmp/perf-result.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 5b: regenerate-perf-baseline — operator-driven refresh of the checked-in
  # perf/baseline.json from this build's package. Runs only when dispatched with
  # regenerate_perf_baseline=true. The refreshed baseline is uploaded as an
  # artifact (perf-baseline-<version>) for a human to review and commit; CI does
  # not push to the repo. The seeded perf/baseline.json is a hand-authored
  # placeholder until this job replaces it with real measurements.
  # ---------------------------------------------------------------------------
  regenerate-perf-baseline:
    name: Regenerate perf baseline (manual)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.regenerate_perf_baseline &&
      needs.build.result == 'success'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.build.outputs.nuget_version }}
          path: /tmp/packages/

      - name: Run BenchmarkDotNet and capture baseline
        run: |
          $feedDir = "/tmp/local-feed"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Copy-Item /tmp/packages/*.nupkg $feedDir/

          $ver = "${{ needs.build.outputs.nuget_version }}"
          if (-not $ver) { throw "nuget_version output is empty." }
          $proj = "test/InitialForce.WpfSmoke/Perf/InitialForce.WpfPerf.csproj"

          dotnet nuget add source $feedDir --name local-packed --configfile NuGet.config
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.config
          dotnet restore $proj `
            -p:InitialForceWpfVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }

          dotnet run -c Release --no-restore --project $proj `
            -p:InitialForceWpfVersion=$ver `
            -- --filter '*' --exporters json --artifacts /tmp/bdn-artifacts
          if ($LASTEXITCODE -ne 0) { throw "BenchmarkDotNet run failed" }

          $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*-report-full-compressed.json' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $json) {
            $json = Get-ChildItem /tmp/bdn-artifacts -Recurse -Filter '*.json' -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if (-not $json) { throw "No BenchmarkDotNet JSON export produced." }
          New-Item -ItemType Directory -Force -Path perf | Out-Null
          Copy-Item $json.FullName perf/baseline.json -Force
          Write-Host "Regenerated perf/baseline.json from $($json.FullName)"
          Write-Host "Review and commit this file to update the checked-in baseline."
        shell: pwsh

      - name: Upload regenerated baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ needs.build.outputs.nuget_version }}
          path: perf/baseline.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 6: release-notes — run Claude to draft GitHub Release notes from ledger
  # ---------------------------------------------------------------------------
  release-notes:
    name: Generate release notes (Claude Sonnet)
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      notes_artifact: release-notes-${{ needs.build.outputs.nuget_version }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine previous tag
        id: prev-tag
        run: |
          CURRENT_TAG="${{ env.TAG_NAME }}"
          PREV_TAG=$(git tag --list 'if-10.0.*' --sort=-version:refname \
            | grep -v "^${CURRENT_TAG}$" | head -1 || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV_TAG"
        shell: bash

      - name: Load release-notes prompt
        id: load-prompt
        shell: bash
        run: |
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/release-notes.md
            echo
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Run release notes prompt (Claude Sonnet)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 10
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,Grep
            --disallowedTools Edit,Write,mcp__github__push_files
          github_token: ${{ steps.app-token.outputs.token }}
        env:
          CONFIG_PATH: .if-fork/config.yaml
          FROM_REF: ${{ steps.prev-tag.outputs.prev_tag }}
          TO_REF: ${{ env.TAG_NAME }}
          VERSION_STRING: ${{ needs.build.outputs.nuget_version }}
          OUTPUT_PATH: /tmp/release-notes-${{ needs.build.outputs.nuget_version }}.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ needs.build.outputs.nuget_version }}
          path: /tmp/release-notes-${{ needs.build.outputs.nuget_version }}.md
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 7: publish — gated on wpf-nuget-publish (manual reviewer approval)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish NuGets (human gate)
    needs: [build, smoke-on-pack, perf-on-pack, release-notes]
    if: needs.build.result == 'success' && needs.smoke-on-pack.result == 'success' && needs.perf-on-pack.result == 'success'
    runs-on: ubuntu-latest
    environment: wpf-nuget-publish

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.build.outputs.nuget_version }}
          path: /tmp/packages/

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.build.outputs.nuget_version }}
          path: /tmp/

      - name: MED-3 SHA256 cross-check — verify package integrity
        run: |
          # Re-hash all downloaded .nupkg files and compare against the
          # SHA256 sums recorded at build time via the build-hashes artifact.
          # Phase-2: integrate SLSA provenance via slsa-framework/slsa-github-generator
          # when org-level SLSA attestation infrastructure is ready.
          echo "Computing SHA256 hashes of downloaded packages..."
          sha256sum /tmp/packages/*.nupkg | tee /tmp/publish-sha256.txt
          echo "SHA256 verification complete. Hashes stored at /tmp/publish-sha256.txt"
          # Cross-check: ensure no zero-byte files slipped through
          for pkg in /tmp/packages/*.nupkg; do
            if [ ! -s "$pkg" ]; then
              echo "::error::Zero-byte package detected: $pkg"
              exit 1
            fi
          done
        shell: bash

      - name: Publish to GitHub Packages
        # Use the built-in GITHUB_TOKEN. Workflow already grants
        # packages:write at the top of this file. A PAT (NUGET_FEED_PAT)
        # is only required if/when we publish to nuget.org.
        run: |
          for pkg in /tmp/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/InitialForce/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done
        shell: bash

      - name: Create GitHub Release
        run: |
          NOTES_FILE=$(ls /tmp/release-notes-*.md 2>/dev/null | head -1 || echo "")
          if [ -z "$NOTES_FILE" ]; then
            NOTES_ARGS="--generate-notes"
          else
            NOTES_ARGS="--notes-file $NOTES_FILE"
          fi
          # shellcheck disable=SC2086
          gh release create "${{ env.TAG_NAME }}" \
            --title "InitialForce WPF ${{ env.TAG_NAME }}" \
            $NOTES_ARGS \
            /tmp/packages/*.nupkg
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash

  # ---------------------------------------------------------------------------
  # Job 8: record — emit published ledger event with version + tag + commit
  # ---------------------------------------------------------------------------
  record:
    name: Record published ledger event
    needs: [build, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Emit published ledger event
        run: |
          TAG="${{ env.TAG_NAME }}"
          VERSION="${{ needs.build.outputs.nuget_version }}"
          # CRIT-2: Use correct ledger-event.py CLI args.
          # pr-number=0 since releases are not tied to PRs; the ledger schema
          # accepts 0 as a synthetic "no PR" sentinel for release events.
          python tools/ledger-event.py \
            --event published \
            --pr-number 0 \
            --head-sha "${{ github.sha }}" \
            --actor release \
            --details-json "{\"tag\":\"$TAG\",\"version\":\"$VERSION\"}" \
            --push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"
        shell: bash
