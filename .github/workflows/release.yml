# .github/workflows/release.yml
#
# Publishes one release tag to nuget.org. Trust model:
# - There is no tag-push trigger. The workflow runs only through
#   workflow_dispatch on if/main (auto-release.yml dispatches it), so the
#   workflow file and every tool it runs come from if/main, never from the tag.
# - The tag is data. verify-tag (tools/verify-release-tag.sh) checks its
#   name, verifies its signature with if/main's docs/bot-gpg-pubkey.asc,
#   pinned to the GH_BOT_GPG_FINGERPRINT fingerprint (no private key anywhere
#   in this workflow), and checks that its commit is on if/main.
# - The tag's commit is built and tested with no secrets (build.yml), then
#   perf-checked. Only publish gets NUGET_ORG_API_KEY, after every gate passed.
# - Scripts never expand ${{ }} expressions that carry the tag or other input;
#   they read them from environment variables.
# - The ledger "published" event is written by release-record.yml, which
#   holds the bot signing key; this workflow does not.
name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. if-10.0.8-perf.20261008. Run on if/main: gh workflow run release.yml --ref if/main -f tag=<tag>"
        required: true
        type: string
      regenerate_perf_baseline:
        description: "Also regenerate perf/baseline.json from this build's package (uploaded as an artifact to commit manually)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  TAG_NAME: ${{ inputs.tag }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: gate — autonomy-check (requested_action: release-publish)
  # ---------------------------------------------------------------------------
  gate:
    name: Autonomy gate (release-publish)
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: release-publish

  # ---------------------------------------------------------------------------
  # Job 2: verify-tag — trusted if/main code checks the tag as data.
  # Its only secret is the key fingerprint; no private key.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify tag signature and reachability
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      tag_sha: ${{ steps.verify.outputs.tag_sha }}
      nuget_version: ${{ steps.verify.outputs.nuget_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is bot-signed and reachable from if/main
        id: verify
        env:
          # Only the fingerprint, to pin the key file; no private key here.
          BOT_FPR: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail

          # The workflow, tools and public key must be if/main's, not a
          # branch's copy.
          if [ "$GITHUB_REF" != "refs/heads/if/main" ]; then
            echo "::error::Run release.yml on if/main: gh workflow run release.yml --ref if/main -f tag=<tag>"
            exit 1
          fi

          # verify-release-tag.sh checks the tag name before any other use,
          # then fetches the tag and checks its signature against
          # docs/bot-gpg-pubkey.asc (pinned to BOT_FPR) and that its commit is
          # on if/main. GITHUB_SHA is the if/main commit this run started on.
          TAG_COMMIT=$(FETCH=1 PUBKEY_FILE=docs/bot-gpg-pubkey.asc MAIN_REF="$GITHUB_SHA" \
            tools/verify-release-tag.sh "$TAG_NAME") || {
            echo "::error::Release tag refused; the log above says why"
            exit 1
          }
          # The version depends only on the tag, so a re-run packs the same version.
          VERSION=$(python3 tools/release-version.py version --tag "$TAG_NAME")

          {
            echo "tag=$TAG_NAME"
            echo "tag_sha=$TAG_COMMIT"
            echo "nuget_version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG_NAME verified: commit=$TAG_COMMIT, NuGet version $VERSION"
        shell: bash

  # ---------------------------------------------------------------------------
  # Job 3: build — build.yml from if/main, run on the tag's commit with no
  # secrets: lint, build, crossgen, pack, smoke on the packed nupkg,
  # anti-stub, aggregate. The packages are in this run's build-x64 artifact.
  # ---------------------------------------------------------------------------
  build:
    name: Build, pack and smoke
    needs: verify-tag
    if: needs.verify-tag.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      package_version: ${{ needs.verify-tag.outputs.nuget_version }}
      ref: ${{ needs.verify-tag.outputs.tag_sha }}

  # ---------------------------------------------------------------------------
  # Job 4: perf-on-pack — BenchmarkDotNet harness from the tag's commit
  # (candidate/), checked by if/main's check-regression.py against if/main's
  # perf/baseline.json. NOTE: the harness benchmarks
  # (test/InitialForce.WpfSmoke/Perf/PerfHarness.cs) are placeholder loops
  # today, so this gate does not measure WPF performance yet.
  # ---------------------------------------------------------------------------
  perf-on-pack:
    name: Perf regression check against packed NuGet
    needs: [verify-tag, build]
    if: needs.build.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      NUGET_VERSION: ${{ needs.verify-tag.outputs.nuget_version }}
      TAG_SHA: ${{ needs.verify-tag.outputs.tag_sha }}

    steps:
      - name: Check out if/main (gate tools and baseline)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the release commit (perf harness)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag_sha }}
          path: candidate
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: ${{ runner.temp }}/build

      - name: Run BenchmarkDotNet perf harness against packed nupkg
        working-directory: candidate
        run: |
          $feedDir = Join-Path $env:RUNNER_TEMP "local-feed"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Get-ChildItem (Join-Path $env:RUNNER_TEMP "build") -Recurse -Filter '*.nupkg' | Copy-Item -Destination $feedDir

          $ver = $env:NUGET_VERSION
          if (-not $ver) { throw "nuget_version output is empty — cannot resolve InitialForceWpfVersion." }
          $proj = "test/InitialForce.WpfSmoke/Perf/InitialForce.WpfPerf.csproj"
          $bdn = Join-Path $env:RUNNER_TEMP "bdn-artifacts"

          dotnet nuget add source $feedDir --name local-packed --configfile NuGet.config
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.config
          dotnet restore $proj `
            -p:InitialForceWpfVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }

          # Standalone BenchmarkDotNet console harness (NOT the NUnit stubs).
          dotnet run -c Release --no-restore --project $proj `
            -p:InitialForceWpfVersion=$ver `
            -- --filter '*' --exporters json --artifacts $bdn
          if ($LASTEXITCODE -ne 0) { throw "BenchmarkDotNet run failed" }
        shell: pwsh

      - name: Check perf regression (hard on Allocated, warn-only on time)
        run: |
          # BenchmarkDotNet writes one JSON report per benchmark class. Pass
          # all of them; check-regression fails on any baseline scenario that
          # is missing or has no measurement.
          $bdn = Join-Path $env:RUNNER_TEMP "bdn-artifacts"
          $reports = @(Get-ChildItem $bdn -Recurse -Filter '*-report-full-compressed.json' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            $reports = @(Get-ChildItem $bdn -Recurse -Filter '*-report-full.json' -ErrorAction SilentlyContinue)
          }
          if ($reports.Count -eq 0) { throw "No BenchmarkDotNet JSON report under $bdn." }
          Write-Host "Reports: $($reports.Name -join ', ')"
          $out = Join-Path $env:RUNNER_TEMP "perf-result.json"
          python tools/check-regression.py `
            --current @($reports.FullName) `
            --baseline perf/baseline.json `
            --current-sha $env:TAG_SHA `
            --output $out `
            --threshold-warn 5 `
            --threshold-fail 15 `
            --warn-only-metrics Mean
          if ($LASTEXITCODE -ne 0) { throw "perf gate failed (exit $LASTEXITCODE)" }
        shell: pwsh

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ needs.verify-tag.outputs.nuget_version }}
          path: ${{ runner.temp }}/perf-result.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 5b: regenerate-perf-baseline — operator-driven refresh of the checked-in
  # perf/baseline.json from this build's package. Runs only when dispatched with
  # regenerate_perf_baseline=true. The merged baseline (all benchmark classes)
  # is uploaded as an artifact (perf-baseline-<version>) for a human to review
  # and commit; CI does not push to the repo.
  # ---------------------------------------------------------------------------
  regenerate-perf-baseline:
    name: Regenerate perf baseline (manual)
    needs: [verify-tag, build]
    if: inputs.regenerate_perf_baseline && needs.build.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      NUGET_VERSION: ${{ needs.verify-tag.outputs.nuget_version }}
      TAG_SHA: ${{ needs.verify-tag.outputs.tag_sha }}

    steps:
      - name: Check out if/main (merge tool)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the release commit (perf harness)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag_sha }}
          path: candidate
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download packed NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: ${{ runner.temp }}/build

      - name: Run BenchmarkDotNet
        working-directory: candidate
        run: |
          $feedDir = Join-Path $env:RUNNER_TEMP "local-feed"
          New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
          Get-ChildItem (Join-Path $env:RUNNER_TEMP "build") -Recurse -Filter '*.nupkg' | Copy-Item -Destination $feedDir

          $ver = $env:NUGET_VERSION
          if (-not $ver) { throw "nuget_version output is empty." }
          $proj = "test/InitialForce.WpfSmoke/Perf/InitialForce.WpfPerf.csproj"
          $bdn = Join-Path $env:RUNNER_TEMP "bdn-artifacts"

          dotnet nuget add source $feedDir --name local-packed --configfile NuGet.config
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.config
          dotnet restore $proj `
            -p:InitialForceWpfVersion=$ver
          if ($LASTEXITCODE -ne 0) { throw "restore failed" }

          dotnet run -c Release --no-restore --project $proj `
            -p:InitialForceWpfVersion=$ver `
            -- --filter '*' --exporters json --artifacts $bdn
          if ($LASTEXITCODE -ne 0) { throw "BenchmarkDotNet run failed" }
        shell: pwsh

      - name: Merge all reports into the baseline
        run: |
          $bdn = Join-Path $env:RUNNER_TEMP "bdn-artifacts"
          $reports = @(Get-ChildItem $bdn -Recurse -Filter '*-report-full-compressed.json' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            $reports = @(Get-ChildItem $bdn -Recurse -Filter '*-report-full.json' -ErrorAction SilentlyContinue)
          }
          if ($reports.Count -eq 0) { throw "No BenchmarkDotNet JSON report under $bdn." }
          New-Item -ItemType Directory -Force -Path perf | Out-Null
          python tools/check-regression.py `
            --current @($reports.FullName) `
            --current-sha $env:TAG_SHA `
            --merge-only `
            --merged-output perf/baseline.json
          if ($LASTEXITCODE -ne 0) { throw "baseline merge failed (exit $LASTEXITCODE)" }
          Write-Host "Review and commit perf/baseline.json to update the checked-in baseline."
        shell: pwsh

      - name: Upload regenerated baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ needs.verify-tag.outputs.nuget_version }}
          path: perf/baseline.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 6: release-notes — Claude drafts notes from a commit list.
  # The commit subjects include community PR titles, which are untrusted text.
  # So the agent gets: the list inside its prompt and no tools at all (no
  # Read, no Bash, no Write), only user-level settings (no project settings,
  # hooks, CLAUDE.md or MCP servers from the checkout), no persisted git
  # credentials and a read-only token. Its final answer becomes the notes;
  # publish falls back to generated notes if this job fails or returns
  # nothing.
  # ---------------------------------------------------------------------------
  release-notes:
    name: Generate release notes (Claude Sonnet)
    needs: [verify-tag, build]
    if: needs.build.result == 'success'
    # Notes are optional: publish falls back to generated notes, so a failed
    # notes run must not mark the whole release as failed.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      TAG_SHA: ${{ needs.verify-tag.outputs.tag_sha }}
      NUGET_VERSION: ${{ needs.verify-tag.outputs.nuget_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write the commit list since the last published release
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notes-input"
          LIST="$RUNNER_TEMP/notes-input/commits.txt"
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ "$PREV" =~ ^if-[0-9]+\.[0-9]+\.[0-9]+-perf\.[0-9]{8}(\.[0-9]+)?$ ]] \
             && git fetch --no-tags origin "+refs/tags/$PREV:refs/tags/$PREV"; then
            RANGE="refs/tags/$PREV..$TAG_SHA"
            FROM="$PREV"
          else
            RANGE="--max-count=200 $TAG_SHA"
            FROM="(no earlier published release; last 200 commits)"
          fi
          # One line per commit: SHA, author, subject, Upstream-PR and
          # Co-authored-by trailers, top-level folders it touches.
          # shellcheck disable=SC2086
          git log --no-merges --max-count=300 --format='%H' $RANGE | while read -r sha; do
            META=$(git log -1 --format='%an%x09%s%x09%(trailers:key=Upstream-PR,valueonly,separator=%x2C)%x09%(trailers:key=Co-authored-by,valueonly,separator=%x2C)' "$sha")
            AREAS=$(git show --no-renames --name-only --format= "$sha" | cut -d/ -f1 | sort -u | paste -sd, -)
            printf '%s\t%s\t%s\n' "$sha" "$META" "$AREAS"
          done > "$LIST"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < "$LIST") commits from $FROM to $TAG"
        shell: bash

      - name: Load release-notes prompt
        id: load-prompt
        env:
          FROM: ${{ steps.commits.outputs.from }}
          LIST: ${{ steps.commits.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          # A random delimiter: a commit subject cannot end the value early.
          EOF_MARK="EOF_$(openssl rand -hex 16)"
          {
            echo "prompt<<$EOF_MARK"
            cat .if-fork/prompts/release-notes.md
            echo
            echo "## This run"
            echo
            echo "- Range: $FROM to $TAG. Version: $NUGET_VERSION. Tag: $TAG."
            echo "- Today (UTC): $(date -u +%Y-%m-%d)."
            echo
            echo "<untrusted_input>"
            sed 's#</*untrusted_input>#[removed]#g' "$LIST"
            echo "</untrusted_input>"
            echo "$EOF_MARK"
          } >> "$GITHUB_OUTPUT"

      # Trusted settings only: --setting-sources user skips the checkout's
      # .claude/ settings, hooks and CLAUDE.md; --strict-mcp-config skips its
      # .mcp.json. Every tool is denied, including Read of /proc (the API key
      # is in the process environment) and of the runner's _temp folder.
      - name: Run release notes prompt (Claude Sonnet)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: initial-force-wpf-bot,github-actions
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          settings: >-
            {"disableAllHooks": true,
            "permissions": {"deny": ["Read(//proc/**)", "Read(//home/runner/work/_temp/**)"]}}
          claude_args: >-
            --setting-sources user
            --strict-mcp-config
            --max-turns 3
            --model claude-sonnet-4-6
            --disallowedTools Bash,Read,Glob,Grep,LS,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,Task,Read(//proc/**),Read(//home/runner/work/_temp/**)

      - name: Extract the notes from the agent's final answer
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release-notes-$NUGET_VERSION.md"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -r '[.[] | select(.type == "result")] | last | .result // empty' \
              "$EXECUTION_FILE" > "$OUT" || true
          fi
          if [ ! -s "$OUT" ]; then
            echo "::warning::The agent returned no notes; the GitHub Release will use generated notes."
            rm -f "$OUT"
          fi
        shell: bash

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ needs.verify-tag.outputs.nuget_version }}
          path: ${{ runner.temp }}/release-notes-${{ needs.verify-tag.outputs.nuget_version }}.md
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 7: publish — nuget.org, GitHub Packages, then the GitHub Release.
  # Runs only when build (every build.yml gate, including smoke on the packed
  # nupkg) and perf-on-pack passed. The only job with NUGET_ORG_API_KEY.
  # Release notes are optional: without them the GitHub Release uses
  # generated notes. Every step is deterministic; no agent runs here.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish NuGets
    needs: [verify-tag, build, perf-on-pack, release-notes]
    if: >-
      !cancelled() &&
      needs.verify-tag.result == 'success' &&
      needs.build.result == 'success' &&
      needs.perf-on-pack.result == 'success'
    runs-on: ubuntu-latest
    environment: wpf-nuget-publish
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      NUGET_VERSION: ${{ needs.verify-tag.outputs.nuget_version }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: ${{ runner.temp }}/build

      - name: Download release notes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.verify-tag.outputs.nuget_version }}
          path: ${{ runner.temp }}/notes

      - name: MED-3 SHA256 cross-check — verify package integrity
        run: |
          set -euo pipefail
          PKGS="$RUNNER_TEMP/packages"
          mkdir -p "$PKGS"
          find "$RUNNER_TEMP/build" -name '*.nupkg' -exec cp {} "$PKGS/" \;
          # Exactly the two packages, both at the version derived from the tag.
          for id in InitialForce.WPF InitialForce.WPF.RuntimeOverride; do
            if [ ! -s "$PKGS/$id.$NUGET_VERSION.nupkg" ]; then
              echo "::error::Missing or empty $id.$NUGET_VERSION.nupkg"
              ls -l "$PKGS"
              exit 1
            fi
          done
          COUNT=$(find "$PKGS" -name '*.nupkg' | wc -l)
          if [ "$COUNT" -ne 2 ]; then
            echo "::error::Expected 2 packages, found $COUNT"
            ls -l "$PKGS"
            exit 1
          fi
          # Phase-2: integrate SLSA provenance via slsa-framework/slsa-github-generator
          # when org-level SLSA attestation infrastructure is ready.
          sha256sum "$PKGS"/*.nupkg | tee "$RUNNER_TEMP/publish-sha256.txt"
        shell: bash

      - name: Publish to nuget.org
        # --skip-duplicate makes a re-run for the same tag a no-op.
        run: |
          set -euo pipefail
          for pkg in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_ORG_API_KEY" \
              --skip-duplicate
          done
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        shell: bash

      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          for pkg in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/InitialForce/index.json" \
              --api-key "$GITHUB_PACKAGES_TOKEN" \
              --skip-duplicate
          done
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        shell: bash

      - name: Create GitHub Release
        # auto-release.yml and release-record.yml treat a tag that has a
        # GitHub Release as published, so this must stay the last step.
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to do."
            exit 0
          fi
          NOTES="$RUNNER_TEMP/notes/release-notes-$NUGET_VERSION.md"
          if [ -s "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "InitialForce WPF $NUGET_VERSION" \
            "${NOTES_ARGS[@]}" \
            "$RUNNER_TEMP"/packages/*.nupkg
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
