# .github/workflows/pr-review.yml
# PR Review — 2x independent Claude reviewers
#
# Triggered by:
#   - repository_dispatch "pr-discovered" from pr-discovery.yml.
#     client_payload: {pr_number: <int>, head_sha: <sha>}
#   - workflow_dispatch with pr_number + head_sha inputs (manual / R4-4 fix)
#
# Models and the turn budget come from .if-fork/config.yaml
# (claude_models.review_1, claude_models.review_2, claude_limits.max_turns_review).
#
# Job topology:
#   gate → review-1  ──┐
#          review-2  ──┤─→ merge-verdict
#                       (review-2 runs independently; no shared cache or output
#                        with review-1 until both are complete)
#
# The reviewers only write verdict files. merge-verdict records everything in
# the ledger in ONE commit ([skip ci]): review_1, review_2, merged_verdict and
# the outcome event (approved / rejected / escalated). It pushes that commit
# BEFORE dispatching pr-ingestion, because pr-ingestion's SHA check reads the
# review_N head_sha from the ledger. A reviewer that crashes or runs out of
# turns counts as escalate-to-human, so every run ends with a recorded outcome
# and pr-discovery does not re-dispatch the same head_sha.
#
# IF_REVIEW_DOUBLE_REQUIRED repo variable:
#   unset / "true" (default) → both review-1 AND review-2 must complete before merge-verdict
#   "false"                  → review-2 is SKIPPED (single-review fast path, emergency only).
#                              The fast path additionally requires a manual approval via
#                              environment: branch-promotion and emits a warning ledger event.
#                              This should never be used in normal operation.
#
# Concurrency: one run per PR number; cancel-in-progress is false so an in-flight
# review is never silently aborted by a re-trigger.

name: PR Review (2x Independent)

on:
  repository_dispatch:
    types: [pr-discovered]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Upstream dotnet/wpf PR number to review"
        required: true
        type: string
      head_sha:
        description: "Pinned head SHA of the upstream PR (from discovery ledger event)"
        required: true
        type: string

concurrency:
  group: pr-review-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
  HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: gate — autonomy kill-switch check
  # ---------------------------------------------------------------------------
  gate:
    name: Autonomy gate
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: claude-invoke
      bypass_for_human_dispatch: ${{ github.event_name == 'workflow_dispatch' }}

  # ---------------------------------------------------------------------------
  # Job 2: review-1 — Reviewer 1 (temperature 0.0, diff only)
  # Runs independently of review-2; no output shared until merge-verdict.
  # ---------------------------------------------------------------------------
  review-1:
    name: Reviewer 1 (temp=0.0, diff-only)
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials

    # The reviewer reads untrusted PR content with a Bash tool, so it gets the
    # read-only workflow token, never the bot App token (which can push).
    steps:
      - uses: actions/checkout@v4

      - name: Check dispatch payload
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::pr_number/head_sha missing or malformed (pr_number='$PR_NUMBER' head_sha='$HEAD_SHA')"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read review settings from config.yaml
        id: settings
        run: |
          pip install --quiet pyyaml
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open(".if-fork/config.yaml"))
          print(f"model={c['claude_models']['review_1']}")
          print(f"max_turns={c['claude_limits']['max_turns_review']}")
          EOF

      - name: Load pr-review-1 prompt
        id: load-prompt-1
        shell: bash
        run: |
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/pr-review-1.md
            echo
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Run review-1 (prompt pr-review-1.md)
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt-1.outputs.prompt }}
          claude_args: >-
            --max-turns ${{ steps.settings.outputs.max_turns }}
            --model ${{ steps.settings.outputs.model }}
            --allowedTools Bash,Read,Grep,mcp__github__pull_request_read,mcp__github__get_file_contents
            --disallowedTools Edit,Write,mcp__github__create_pull_request,mcp__github__push_files
          github_token: ${{ github.token }}
        env:
          CONFIG_PATH: .if-fork/config.yaml
          PR_URL: https://github.com/dotnet/wpf/pull/${{ env.PR_NUMBER }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          REVIEWER_ID: ${{ steps.settings.outputs.model }}-review-1
          VERDICT_OUTPUT_PATH: /tmp/review-1.json
          REVIEW_TEMPERATURE: "0.0"
          GH_TOKEN: ${{ github.token }}

      # Upload whatever verdict exists, even when the reviewer hit its turn
      # limit after writing it. merge-verdict treats a missing file as
      # escalate-to-human.
      - name: Upload review-1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-1.json
          path: /tmp/review-1.json
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 3: review-2 — Reviewer 2 (temperature 0.7, diff + source context)
  # Runs INDEPENDENTLY from review-1 (both need only gate, not each other).
  # Skipped when IF_REVIEW_DOUBLE_REQUIRED is "false" (single-review fast path).
  # The fast path additionally requires a manual approval via environment: branch-promotion.
  # ---------------------------------------------------------------------------
  review-2:
    name: Reviewer 2 (temp=0.7, diff+context, isolated)
    needs: gate
    # NOTE: review-2 intentionally does NOT need review-1.
    # Independence is the core security property: two reviewers with no shared
    # state before merge-verdict collapses the results.
    # review-2 is skipped when IF_REVIEW_DOUBLE_REQUIRED == "false" (emergency
    # single-review fast path). A warning is emitted via merge-verdict in that case.
    # Default (unset) = require two reviews.
    if: needs.gate.outputs.proceed == 'true' && vars.IF_REVIEW_DOUBLE_REQUIRED != 'false'
    runs-on: ubuntu-latest
    environment: bot-credentials

    # The reviewer reads untrusted PR content with a Bash tool, so it gets the
    # read-only workflow token, never the bot App token (which can push).
    steps:
      - uses: actions/checkout@v4

      - name: Check dispatch payload
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::pr_number/head_sha missing or malformed (pr_number='$PR_NUMBER' head_sha='$HEAD_SHA')"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read review settings from config.yaml
        id: settings
        run: |
          pip install --quiet pyyaml
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open(".if-fork/config.yaml"))
          print(f"model={c['claude_models']['review_2']}")
          print(f"max_turns={c['claude_limits']['max_turns_review']}")
          EOF

      - name: Load pr-review-2 prompt
        id: load-prompt-2
        shell: bash
        run: |
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/pr-review-2.md
            echo
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Run review-2 (prompt pr-review-2.md, different from review-1)
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt-2.outputs.prompt }}
          claude_args: >-
            --max-turns ${{ steps.settings.outputs.max_turns }}
            --model ${{ steps.settings.outputs.model }}
            --allowedTools Bash,Read,Grep,mcp__github__pull_request_read,mcp__github__get_file_contents
            --disallowedTools Edit,Write,mcp__github__create_pull_request,mcp__github__push_files
          github_token: ${{ github.token }}
        env:
          CONFIG_PATH: .if-fork/config.yaml
          PR_URL: https://github.com/dotnet/wpf/pull/${{ env.PR_NUMBER }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
          REVIEWER_ID: ${{ steps.settings.outputs.model }}-review-2
          VERDICT_OUTPUT_PATH: /tmp/review-2.json
          REVIEW_TEMPERATURE: "0.7"
          GH_TOKEN: ${{ github.token }}

      - name: Upload review-2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-2.json
          path: /tmp/review-2.json
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 4: single-review-approval — manual gate when fast path is active
  # Required only when IF_REVIEW_DOUBLE_REQUIRED == "false".
  # environment: branch-promotion enforces a human approver before merge-verdict runs.
  # ---------------------------------------------------------------------------
  single-review-approval:
    name: Manual approval (single-review fast path)
    needs: [gate, review-1]
    if: needs.gate.outputs.proceed == 'true' && vars.IF_REVIEW_DOUBLE_REQUIRED == 'false'
    runs-on: ubuntu-latest
    environment: branch-promotion

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Warn and record single-review fast path
        run: |
          echo "::warning::IF_REVIEW_DOUBLE_REQUIRED is 'false' — single-review fast path active. This bypasses the two-reviewer independence guarantee. Use only in emergencies."
          python tools/ledger-event.py \
            --event review_single_path_warning \
            --pr-number "${{ env.PR_NUMBER }}" \
            --head-sha "${{ env.HEAD_SHA }}" \
            --actor pr-review \
            --details-json '{"reason": "IF_REVIEW_DOUBLE_REQUIRED_false", "fast_path": true, "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            --push
        env:
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # ---------------------------------------------------------------------------
  # Job 5: merge-verdict — Collapse both reviewer outputs into a final decision,
  # record it in the ledger (one commit), then hand off.
  # Runs after BOTH review-1 and review-2 complete (or review-2 is skipped and
  # single-review-approval has been manually approved).
  # ---------------------------------------------------------------------------
  merge-verdict:
    name: Merge verdicts and emit outcome
    needs: [gate, review-1, review-2, single-review-approval]
    # Run even when a reviewer failed (its missing verdict becomes an
    # escalation), but not when the run was cancelled or the gate said no.
    # If single-review-approval ran (fast path active), it must have succeeded or been skipped.
    if: >-
      always() &&
      needs.gate.outputs.proceed == 'true' &&
      (needs.review-1.result == 'success' || needs.review-1.result == 'failure') &&
      needs.review-2.result != 'cancelled' &&
      (needs.single-review-approval.result == 'success' || needs.single-review-approval.result == 'skipped')
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download review artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "review-*.json"
          merge-multiple: true
          path: /tmp/verdicts/

      - name: Import bot GPG key
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      # merge-verdicts.py exits 0 approved, 1 rejected, 2 escalated, 3 error.
      # 1 and 2 are normal outcomes here, not step failures.
      - name: Merge verdicts
        id: merge
        run: |
          REVIEW_2_ARGS=(--review-2 /tmp/verdicts/review-2.json)
          if [ "${{ vars.IF_REVIEW_DOUBLE_REQUIRED }}" = "false" ]; then
            REVIEW_2_ARGS=(--single-review)
          fi
          set +e
          python tools/merge-verdicts.py \
            --review-1 /tmp/verdicts/review-1.json \
            "${REVIEW_2_ARGS[@]}" \
            --missing-as-escalate \
            --pr-number "${{ env.PR_NUMBER }}" \
            --head-sha "${{ env.HEAD_SHA }}" \
            --output /tmp/merged-verdict.json \
            --events-out /tmp/review-events.jsonl \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          rc=$?
          set -e
          if [ "$rc" -gt 2 ]; then
            echo "::error::merge-verdicts.py failed (exit $rc)"
            exit "$rc"
          fi
          VERDICT=$(python -c "import json; print(json.load(open('/tmp/merged-verdict.json'))['verdict'])")
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "::notice::PR #${{ env.PR_NUMBER }} @ ${{ env.HEAD_SHA }}: $VERDICT"

      # One ledger commit for the whole review: review_1, review_2,
      # merged_verdict and the outcome event. Must land before the ingestion
      # dispatch below.
      - name: Record review outcome in ledger (one commit)
        run: |
          python tools/ledger-event.py \
            --events-file /tmp/review-events.jsonl \
            --actor pr-review \
            --message "ledger: review pr#${{ env.PR_NUMBER }} ${{ steps.merge.outputs.verdict }}" \
            --push
        env:
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # approved  → repository_dispatch pr-ingestion-requested {pr_number, head_sha}
      # escalated → review-disagreement issue (needs-human)
      # rejected  → nothing more (already recorded above)
      - name: Hand off (ingestion dispatch or escalation issue)
        run: |
          python tools/dispatch-approved.py \
            --verdict /tmp/merged-verdict.json \
            --repo "${{ github.repository }}" \
            --token-env GH_TOKEN
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
