# .github/workflows/upstream-stable-adoption.yml
#
# Started by upstream-release-poll.yml (daily) or by hand. Fast-forwards
# if/mirror/release/10.0 to the new upstream stable tag, then dispatches
# nightly-rebase so the upstream sync PR is refreshed at once instead of at
# the next 03:07 UTC run.
name: Upstream Stable Adoption
# The poller finds earlier runs for a tag by this title; keep the tag in it.
run-name: Adopt upstream ${{ github.event.client_payload.tag || inputs.tag }}

on:
  repository_dispatch:
    types: [upstream-stable-released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream stable tag to adopt (e.g. v10.0.104)"
        required: true
        type: string

# Own group: this workflow writes only if/mirror/release/10.0. Sharing
# nightly-rebase's group let a scheduled nightly run replace a pending
# adoption run (GitHub keeps one pending run per group).
concurrency:
  group: upstream-mirror-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  UPSTREAM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: autonomy kill-switch gate
  # ---------------------------------------------------------------------------
  gate:
    name: Autonomy Gate
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: upstream-stable-adoption
      bypass_for_human_dispatch: true

  # ---------------------------------------------------------------------------
  # Job 2: Verify the upstream tag exists and is GPG-signed (best-effort)
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify upstream tag ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    # Reads public upstream tags only: no App token, no stored credentials.
    permissions:
      contents: read
    outputs:
      tag_sha: ${{ steps.fetch.outputs.tag_sha }}
      tag_verified: ${{ steps.fetch.outputs.tag_verified }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Add upstream remote and fetch tag
        id: fetch
        run: |
          git remote add upstream https://github.com/dotnet/wpf.git || true
          git fetch upstream --tags

          TAG="$UPSTREAM_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v10.0.12."
            exit 1
          fi

          # Verify tag exists
          if ! git tag --list "$TAG" | grep -qxF "$TAG"; then
            echo "::error::Tag '$TAG' does not exist on upstream dotnet/wpf."
            exit 1
          fi

          TAG_SHA=$(git rev-list -n 1 "refs/tags/$TAG")
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::Tag '$TAG' found at $TAG_SHA"

          # Attempt GPG signature verification (warn-only if not enforced)
          TAG_TYPE=$(git cat-file -t "refs/tags/$TAG")
          if [ "$TAG_TYPE" = "tag" ]; then
            if git verify-tag "$TAG" 2>&1; then
              echo "tag_verified=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Tag '$TAG' GPG signature is valid."
            else
              echo "tag_verified=unsigned_or_unverifiable" >> "$GITHUB_OUTPUT"
              echo "::warning::Tag '$TAG' GPG signature could not be verified (signing may not be enforced for dotnet/wpf tags). Continuing."
            fi
          else
            # Lightweight tag — no signature object
            echo "tag_verified=lightweight" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag '$TAG' is a lightweight tag (no GPG signature object). Continuing."
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Fast-forward if/mirror/release/10.0 to the new upstream tag
  # ---------------------------------------------------------------------------
  promote-mirror:
    name: Promote mirror branch to ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
    needs: [gate, verify-tag]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials

    outputs:
      mirror_sha: ${{ steps.promote.outputs.mirror_sha }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/dotnet/wpf.git || true
          git fetch upstream --tags

      - name: Fast-forward mirror branch
        id: promote
        run: |
          TAG="$UPSTREAM_TAG"
          MIRROR_BRANCH="if/mirror/release/10.0"

          # Fetch the mirror branch from origin
          git fetch origin "$MIRROR_BRANCH" || {
            echo "::error::Mirror branch '$MIRROR_BRANCH' not found on origin. Cannot promote."
            exit 1
          }

          CURRENT_MIRROR_SHA=$(git rev-parse "origin/$MIRROR_BRANCH")

          if git merge-base --is-ancestor "$TAG_SHA" "$CURRENT_MIRROR_SHA"; then
            echo "::notice::'$MIRROR_BRANCH' already contains '$TAG'. Nothing to promote."
            echo "mirror_sha=$CURRENT_MIRROR_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fast-forward only. The upstream tags for 10.0 sit on release/10.0,
          # so a non-fast-forward means the mirror was changed by hand.
          if ! git merge-base --is-ancestor "$CURRENT_MIRROR_SHA" "$TAG_SHA"; then
            echo "::error::Cannot fast-forward '$MIRROR_BRANCH' ($CURRENT_MIRROR_SHA) to '$TAG' ($TAG_SHA): the mirror is not an ancestor of the tag. Reset the mirror to an upstream commit by hand."
            exit 1
          fi

          # Perform the fast-forward push
          git push origin "$TAG_SHA:refs/heads/$MIRROR_BRANCH"

          echo "mirror_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::Mirror branch '$MIRROR_BRANCH' fast-forwarded to '$TAG' ($TAG_SHA)."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_SHA: ${{ needs.verify-tag.outputs.tag_sha }}
          GIT_AUTHOR_NAME: "Claude (Initial Force WPF Bot)"
          GIT_AUTHOR_EMAIL: "wpf-bot@initialforce.com"

  # ---------------------------------------------------------------------------
  # Job 4: Trigger the nightly-rebase workflow against the new mirror
  # ---------------------------------------------------------------------------
  trigger-rebase:
    name: Trigger nightly rebase against ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
    needs: [gate, promote-mirror]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # nightly-rebase syncs upstream release/10.0, which contains the tag.
      # force: rebuild if/staging even when the open sync PR already has
      # this upstream commit or it was reported blocked.
      - name: Dispatch nightly-rebase workflow
        run: |
          jq -n '{event_type: "nightly-rebase", client_payload: {force: true, trigger: "upstream-stable-adoption"}}' \
            | gh api "repos/$GITHUB_REPOSITORY/dispatches" --input -
          echo "::notice::Dispatched nightly-rebase (force) after adopting '$UPSTREAM_TAG'."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # ---------------------------------------------------------------------------
  # Job 5: Summarise the adoption in the run summary (no issue: failures are
  # reported by claude-on-failure.yml, success needs no human)
  # ---------------------------------------------------------------------------
  notify:
    name: Write adoption summary
    needs: [gate, verify-tag, promote-mirror, trigger-rebase]
    if: always() && needs.gate.outputs.proceed == 'true' && needs.promote-mirror.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Write summary
        run: |
          {
            echo "## Upstream tag \`$UPSTREAM_TAG\` adopted"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag commit | \`$TAG_SHA\` |"
            echo "| Tag signature | \`$TAG_VERIFIED\` |"
            echo "| \`if/mirror/release/10.0\` now at | \`$MIRROR_SHA\` |"
            echo "| nightly-rebase dispatch | $DISPATCH_RESULT |"
            echo
            echo "The nightly upstream sync merges upstream \`release/10.0\` into \`if/staging\` and keeps one PR to \`if/main\`, which merges itself when Build passes."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG_SHA: ${{ needs.verify-tag.outputs.tag_sha }}
          TAG_VERIFIED: ${{ needs.verify-tag.outputs.tag_verified }}
          MIRROR_SHA: ${{ needs.promote-mirror.outputs.mirror_sha }}
          DISPATCH_RESULT: ${{ needs.trigger-rebase.result }}
