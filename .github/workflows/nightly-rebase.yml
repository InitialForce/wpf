# .github/workflows/nightly-rebase.yml
#
# Nightly upstream sync. Keeps if/main current with upstream dotnet/wpf
# release/10.0 without rewriting if/main history (the if/main ruleset forbids
# force pushes, and if/main carries merge commits, so a rebase is impossible).
#
# Branch model:
#   if/main     the fork. Upstream release/10.0 plus the fork's patches.
#   if/staging  the sync candidate: if/main with the newest upstream
#               release/10.0 merged in. Rebuilt from if/main by this workflow
#               every time upstream moves; nothing else writes to it.
#
# Flow: if upstream release/10.0 is not yet in if/main, reset if/staging to
# if/main, merge upstream into it (Claude resolves conflicts that are not on
# the denylist), force-push if/staging and keep exactly one PR
# if/staging -> if/main open. build.yml runs on that PR; automerge.yml merges
# it when the build passes. Nothing is pushed and no PR is touched when the
# upstream SHA is already in if/main or already proposed in the open PR.
name: Nightly Rebase

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      force_rebase:
        description: Rebuild if/staging even if the open sync PR already has this upstream SHA
        type: boolean
        default: false
  repository_dispatch:
    types: [nightly-rebase]

concurrency:
  group: release-branch-write
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  IF_REPO_ROOT: ${{ github.workspace }}
  STAGING_BRANCH: if/staging
  MAIN_BRANCH: if/main
  BLOCKED_ISSUE_TITLE: "Nightly upstream sync blocked"

jobs:
  gate:
    name: Autonomy gate
    uses: ./.github/workflows/autonomy-check.yml
    with:
      requested_action: claude-invoke
      bypass_for_human_dispatch: false

  sync:
    name: Merge upstream release/10.0 into if/staging
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: bot-credentials
    outputs:
      result: ${{ steps.plan.outputs.result }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}

    steps:
      - name: Generate GH App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: if/main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Import bot GPG key (also sets user.name/email)
        uses: ./.github/actions/import-bot-gpg
        with:
          gpg-private-key: ${{ secrets.GH_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.GH_BOT_GPG_KEY_ID }}
          gpg-fingerprint: ${{ secrets.GH_BOT_GPG_FINGERPRINT }}

      - name: Decide whether a sync is needed
        id: plan
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/dotnet/wpf.git 2>/dev/null || true
          git fetch --no-tags upstream release/10.0
          git fetch origin "$MAIN_BRANCH" "$STAGING_BRANCH" 2>/dev/null || git fetch origin "$MAIN_BRANCH"
          UPSTREAM_SHA=$(git rev-parse upstream/release/10.0)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::Upstream release/10.0 HEAD: $UPSTREAM_SHA"

          OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$STAGING_BRANCH" --base "$MAIN_BRANCH" \
            --json number --jq '.[0].number // empty')
          echo "open_pr=$OPEN_PR" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" "origin/$MAIN_BRANCH"; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "::notice::if/main already contains upstream $UPSTREAM_SHA. Nothing to do."
            exit 0
          fi

          if [ -n "$OPEN_PR" ] && [ "$FORCE" != "true" ] \
             && git rev-parse --verify -q "origin/$STAGING_BRANCH" >/dev/null \
             && git merge-base --is-ancestor "$UPSTREAM_SHA" "origin/$STAGING_BRANCH"; then
            echo "result=already-proposed" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$OPEN_PR already proposes upstream $UPSTREAM_SHA. Nothing to do."
            exit 0
          fi

          echo "result=merge" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebase || 'false' }}

      - name: Close sync PR made redundant by if/main
        if: steps.plan.outputs.result == 'up-to-date' && steps.plan.outputs.open_pr != ''
        run: |
          gh pr close "${{ steps.plan.outputs.open_pr }}" --repo "$GITHUB_REPOSITORY" \
            --comment "if/main already contains upstream release/10.0 \`${{ steps.plan.outputs.upstream_sha }}\`. Closing this sync PR."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Merge upstream into a fresh if/staging
        id: merge
        if: steps.plan.outputs.result == 'merge'
        run: |
          set -euo pipefail
          git checkout -B "$STAGING_BRANCH" "origin/$MAIN_BRANCH"
          if git merge --no-ff --no-commit "$UPSTREAM_SHA"; then
            echo "::notice::Upstream merged without conflicts."
          fi

          # The fork deliberately deleted upstream's GitHub workflows and
          # CODEOWNERS. When upstream edits one of those, keep the deletion.
          git diff --name-only --diff-filter=U | while read -r f; do
            case "$f" in
              .github/*|CODEOWNERS)
                if ! git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git rm -q --cached -- "$f" && rm -f -- "$f"
                  echo "::notice::Kept fork deletion of $f"
                fi
                ;;
            esac
          done

          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Conflicts: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
            {
              echo 'files<<__EOF_FILES__'
              cat "$RUNNER_TEMP/conflicts.txt"
              echo '__EOF_FILES__'
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}

      - name: Refuse conflicts on denylisted files
        id: denylist
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          set +e
          python3 tools/check-denylist.py --config .if-fork/config.yaml \
            --changed-files "$RUNNER_TEMP/conflicts.txt" > "$RUNNER_TEMP/denylist.json"
          RC=$?
          set -e
          cat "$RUNNER_TEMP/denylist.json"
          if [ "$RC" -eq 0 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            {
              echo "Conflicts touch files on the denylist in \`.if-fork/config.yaml\`, so they were not sent to Claude."
              echo
              echo '```json'
              cat "$RUNNER_TEMP/denylist.json"
              echo '```'
            } > "$RUNNER_TEMP/escalation.md"
          fi

      - name: Load conflict-resolution prompt
        id: load-prompt
        if: steps.denylist.outputs.allowed == 'true'
        run: |
          {
            echo 'prompt<<__EOF_PROMPT__'
            cat .if-fork/prompts/resolve-rebase-conflict.md
            echo
            echo '__EOF_PROMPT__'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve conflicts (Claude Sonnet)
        id: resolve
        if: steps.denylist.outputs.allowed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          claude_args: >-
            --max-turns 40
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,Edit,Write,Grep
            --disallowedTools mcp__github__push_files,mcp__github__create_pull_request
          github_token: ${{ steps.app-token.outputs.token }}
        env:
          CONFIG_PATH: .if-fork/config.yaml
          CONFLICT_FILES: ${{ steps.merge.outputs.files }}
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
          ESCALATION_ISSUE_PATH: ${{ runner.temp }}/escalation.md

      - name: Verify resolution
        id: verify
        if: steps.merge.outputs.has_conflicts == 'true' && steps.denylist.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          OK=true
          if [ -s "$RUNNER_TEMP/escalation.md" ]; then
            echo "::warning::Claude escalated the conflict."
            OK=false
          fi
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -e "$f" ] && grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- "$f"; then
              echo "::error::Conflict markers remain in $f"
              OK=false
            fi
          done < "$RUNNER_TEMP/conflicts.txt"
          if [ "$OK" = "true" ]; then
            # Stage only the files that were in conflict.
            while read -r f; do
              [ -z "$f" ] && continue
              if [ -e "$f" ]; then git add -- "$f"; else git rm -q --cached --ignore-unmatch -- "$f"; fi
            done < "$RUNNER_TEMP/conflicts.txt"
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unmerged paths remain after resolution."
              OK=false
            fi
          fi
          echo "resolved=$OK" >> "$GITHUB_OUTPUT"
          if [ "$OK" != "true" ] && [ ! -s "$RUNNER_TEMP/escalation.md" ]; then
            echo "Claude could not resolve the conflicts in: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")" > "$RUNNER_TEMP/escalation.md"
          fi

      - name: Commit merge and push if/staging
        id: push
        if: >-
          steps.plan.outputs.result == 'merge' &&
          (steps.merge.outputs.has_conflicts == 'false' || steps.verify.outputs.resolved == 'true')
        run: |
          set -euo pipefail
          # Upstream workflows never run in the fork: drop any workflow file
          # upstream added (pushing it would also need the workflows scope).
          git diff --cached --name-only --diff-filter=A "origin/$MAIN_BRANCH" -- .github/workflows \
            | while read -r f; do git rm -q --cached -- "$f"; rm -f -- "$f"; done

          # The merge may only change files that upstream changed. Anything
          # else means the conflict resolver strayed outside its remit.
          BASE=$(git merge-base "origin/$MAIN_BRANCH" "$UPSTREAM_SHA")
          STRAY=$(comm -23 <(git diff --cached --name-only "origin/$MAIN_BRANCH" | sort) \
                           <(git diff --name-only "$BASE" "$UPSTREAM_SHA" | sort))
          if [ -n "$STRAY" ]; then
            echo "::error::Merge touches files upstream did not change: $STRAY"
            echo "The merge result touched files upstream did not change: $STRAY" > "$RUNNER_TEMP/escalation.md"
            exit 0
          fi

          SHORT=$(git rev-parse --short "$UPSTREAM_SHA")
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge upstream release/10.0 ($SHORT) into if/main" \
                       -m "Upstream: dotnet/wpf@$UPSTREAM_SHA"
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "::error::HEAD does not contain upstream $UPSTREAM_SHA after the merge."
            echo "The merge commit was not created." > "$RUNNER_TEMP/escalation.md"
            exit 0
          fi
          OLD=$(git rev-parse -q --verify "origin/$STAGING_BRANCH" || true)
          git push --force-with-lease="refs/heads/$STAGING_BRANCH:$OLD" origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        env:
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}

      - name: Open or update the sync PR
        if: steps.push.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short "$UPSTREAM_SHA")
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --repo "$GITHUB_REPOSITORY" \
              --title "Merge upstream release/10.0 ($SHORT) into if/main"
            gh pr comment "$OPEN_PR" --repo "$GITHUB_REPOSITORY" \
              --body "if/staging rebuilt on upstream \`$UPSTREAM_SHA\`. Run: $RUN_URL"
            PR="$OPEN_PR"
          else
            URL=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$MAIN_BRANCH" --head "$STAGING_BRANCH" \
              --title "Merge upstream release/10.0 ($SHORT) into if/main" \
              --body "Nightly upstream sync. Merges dotnet/wpf \`release/10.0\` at \`$UPSTREAM_SHA\` into \`if/main\`.

          The \`Build\` workflow runs on this PR. When it passes, \`automerge.yml\` merges this PR with a merge commit (unless \`IF_AUTOMERGE_FROZEN=true\`). The nightly job keeps this one PR up to date; it does not open a new one each night.

          Run: $RUN_URL")
            PR="${URL##*/}"
          fi
          # Label separately so a missing label cannot fail PR creation.
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label automated \
            || echo "::warning::Could not add label 'automated' to PR #$PR; automerge.yml will skip it."
          echo "::notice::Sync PR: #$PR"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
          OPEN_PR: ${{ steps.plan.outputs.open_pr }}

      - name: Close blocked-sync issue after a successful sync
        if: steps.plan.outputs.result == 'up-to-date' || steps.push.outputs.pushed == 'true'
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label automated \
                       --search "\"$BLOCKED_ISSUE_TITLE\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Upstream sync succeeded in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          done
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Report blocked sync (one issue, one ledger event per upstream SHA)
        if: >-
          steps.plan.outputs.result == 'merge' && steps.push.outputs.pushed != 'true'
        run: |
          set -euo pipefail
          git merge --abort 2>/dev/null || true
          git checkout -q -B "$MAIN_BRANCH" "origin/$MAIN_BRANCH"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The nightly job could not merge upstream \`release/10.0\` into \`if/main\`."
            echo
            echo "- Upstream SHA: \`$UPSTREAM_SHA\`"
            echo "- Run: $RUN_URL"
            echo
            echo "To fix: merge \`$UPSTREAM_SHA\` into a branch from \`if/main\` by hand, push it as \`if/staging\`, and open a PR to \`if/main\`. The next nightly run closes this issue once \`if/main\` contains the upstream SHA."
            echo
            echo "### Details"
            echo
            cat "$RUNNER_TEMP/escalation.md" 2>/dev/null || echo "No details were written."
          } > "$RUNNER_TEMP/issue.md"

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label automated \
            --search "\"$BLOCKED_ISSUE_TITLE\" in:title" --json number,body \
            --jq '.[0] | select(. != null) | "\(.number) \(.body | contains(env.UPSTREAM_SHA))"')
          if [ -n "$EXISTING" ]; then
            NUM="${EXISTING%% *}"
            if [ "${EXISTING##* }" = "true" ]; then
              echo "::warning::Issue #$NUM already reports this upstream SHA. Not repeating."
              exit 0
            fi
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$BLOCKED_ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/issue.md" --label automated
          fi

          python tools/ledger-event.py \
            --event rebase_failed \
            --pr-number 0 \
            --head-sha "$UPSTREAM_SHA" \
            --actor nightly-rebase \
            --details-json "{\"upstream_sha\":\"$UPSTREAM_SHA\",\"run_url\":\"$RUN_URL\"}" \
            --push
          echo "::warning::Upstream sync blocked. See the '$BLOCKED_ISSUE_TITLE' issue."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
