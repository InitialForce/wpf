# .if-fork/config.yaml — canonical policy file for InitialForce/wpf
# All Claude workflows read this. Changes require CODEOWNERS approval.

schema_version: 1

upstream:
  repo: dotnet/wpf
  tracked_branch: release/10.0
  remote_name: upstream

fork:
  org: InitialForce
  repo: wpf
  active_release_branches:
    - if/release/10.0
  staging_branch: if/staging
  mirror_branch: if/mirror/release/10.0

# Author allowlist — fast-path prior, NOT auto-merge.
# Every patch still goes through 2× Opus review regardless of author.
author_allowlist:
  - h3xds1nz
  - miloush
  - lindexi
  - hexawyz
  - IAmTheCShark
  - smolchanovsky
  - etvorun
  - ThomasGoulet73
  - akshatsinha0
  - dotnet-maestro    # automated dep updates only

# Files that auto-fail conflict resolution (always escalate to human).
file_denylist:
  # supply chain
  - eng/Signing.props
  - eng/Publishing.props
  - eng/Versions.props
  - eng/Version.Details.xml
  - NuGet.config
  - global.json
  - azure-pipelines.yml
  - azure-pipelines1.yml
  - .github/**
  - .if-fork/config.yaml
  - .if-fork/prompts/**
  # high-risk WPF source
  - src/Microsoft.DotNet.Wpf/src/PresentationFramework/System/Windows/Controls/Primitives/ScrollBar.cs
  - src/Microsoft.DotNet.Wpf/src/PresentationFramework/System/Windows/Controls/Primitives/Track.cs
  - src/Microsoft.DotNet.Wpf/src/PresentationFramework/System/Windows/Controls/Primitives/Popup.cs
  - src/Microsoft.DotNet.Wpf/src/PresentationFramework/System/Windows/Controls/Primitives/LayoutInformation.cs
  - src/Microsoft.DotNet.Wpf/src/PresentationCore/System/Windows/Media/Imaging/**
  - src/Microsoft.DotNet.Wpf/src/WpfGfx/**
  - src/Microsoft.DotNet.Wpf/src/PenImc/**

# Tier predicates — used for routing, not for merge gating.
# 2× review still applies to all tiers.
tier_predicates:
  s:
    max_files_touched: 5
    max_loc_delta: 200
    min_review_confidence: 0.92
    allowed_categories: [perf, fix, refactor, test]
  a:
    max_files_touched: 20
    max_loc_delta: 800
    min_review_confidence: 0.80
  b:
    min_review_confidence: 0.60

# Hard-fail patterns in any new patch (auto-unsafe verdict).
review_hard_fail_patterns:
  - "\\[DllImport"
  - "\\bunsafe\\b"
  - "\\bextern\\b"
  - "(?i)base64"
  - "(?i)https?://(?!github\\.com|microsoft\\.com|dotnet\\.microsoft\\.com)"
  - "\\[SecurityCritical\\]\\s*$"     # removal will be detected as deletion of a line matching this
  - "\\[LinkDemand\\]"
  - "Demand\\(\\)"
  - "Process\\.Start"
  - "AppContext\\.TryGetSwitch"
  - "Assembly\\.Load[a-zA-Z]*"
  - "\\bBinaryFormatter\\b"
  - "XmlSerializer\\.Deserialize"

perf:
  regression_threshold_pct: 5.0
  auto_reject_threshold_pct: 15.0

human_gate_environments:
  release: wpf-nuget-publish
  branch_promotion: branch-promotion
  bot_credentials: bot-credentials

conflict_resolution:
  max_hunk_count: 3
  max_conflict_lines: 80
  min_confidence: 0.85
  pause_run_if_escalation_pct_exceeds: 30

stable_adoption:
  abort_run_if_escalation_pct_exceeds: 30

ledger:
  path: .if-fork/patch-ledger.jsonl
  state_path: .if-fork/patch-state.json
  absorbed_manifest_path: .if-fork/absorbed-upstream.json

claude_models:
  triage: claude-haiku-4-5
  review_1: claude-opus-4-7
  review_2: claude-opus-4-7
  cherry_pick: claude-sonnet-4-6
  conflict_resolve: claude-sonnet-4-6
  release_notes: claude-sonnet-4-6
  failure_analysis: claude-sonnet-4-6

claude_limits:
  max_turns_triage: 8
  max_turns_review: 12
  max_turns_cherry_pick: 15
  max_turns_conflict: 20
  daily_token_cap_usd: 25
  monthly_token_cap_usd: 200

bot_identity:
  name: "Claude (Initial Force WPF Bot)"
  email: "wpf-bot@initialforce.com"
  github_app_id_secret: GH_APP_ID
  github_app_private_key_secret: GH_APP_PRIVATE_KEY

autonomy_kill_switches:
  enabled_var: IF_AUTONOMY_ENABLED
  automerge_frozen_var: IF_AUTOMERGE_FROZEN
